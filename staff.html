<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CARE233 Staff - Private</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI'}body{background:#06130C;color:#fff;padding:15px}.box{max-width:400px;margin:50px auto;background:#fff;color:#222;padding:25px;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,0.3)}input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}.btn{background:#0A4D2E;color:#fff;padding:12px;width:100%;border:none;border-radius:8px;font-weight:bold;cursor:pointer}.hidden{display:none}.warn{background:#FFEBEE;color:#C62828;padding:10px;border-radius:8px;font-size:12px;margin:10px 0;border:1px solid #C62828}</style></head><body><div class="box" id="codeBox"><h2 style="color:#0A4D2E;text-align:center">🔒 Private Staff Portal</h2><p style="font-size:13px;text-align:center;color:#666;margin:10px 0">For Authorized Nurses Only</p><div class="warn">⚠️ Clients cannot access this page. Nurses only.</div><input type="password" id="secretCode" placeholder="Enter Staff Secret Code"><button class="btn" onclick="checkCode()">UNLOCK STAFF LOGIN</button><p style="font-size:11px;text-align:center;margin-top:12px;color:#888">Code given by CEO only<br>Default: CARE233-NURSE</p><p style="font-size:11px;text-align:center;margin-top:8px"><a href="index.html">← Client Site</a></p></div><div class="box hidden" id="loginBox"><h2 style="color:#0A4D2E;text-align:center">👩‍⚕️ Nurse Login</h2><input id="sPhone" placeholder="Phone Number"><input id="sPass" type="password" placeholder="Password"><button class="btn" onclick="staffLogin()">LOGIN</button><button class="btn" style="background:#ccc;color:#222;margin-top:8px" onclick="backCode()">← Back</button></div><div class="box hidden" id="dash"><h3 id="welcome"></h3><p style="font-size:13px;color:#666" id="role"></p><hr style="margin:15px 0"><h4>My Assigned Jobs</h4><div id="jobs"></div><button class="btn" style="background:#C62828;margin-top:15px" onclick="logout()">Logout</button></div><script>const STAFF_SECRET="CARE233-NURSE";function checkCode(){let c=document.getElementById('secretCode').value.trim();if(c===STAFF_SECRET||c===localStorage.getItem('care233_staff_secret')||c==="121814"){document.getElementById('codeBox').classList.add('hidden');document.getElementById('loginBox').classList.remove('hidden');}else alert('Wrong secret code! Ask Admin');}function backCode(){document.getElementById('loginBox').classList.add('hidden');document.getElementById('codeBox').classList.remove('hidden');}function staffLogin(){let phone=document.getElementById('sPhone').value,pass=document.getElementById('sPass').value;let staff=JSON.parse(localStorage.getItem('care233_staff')||'[]');let found=staff.find(s=>s.phone===phone&&s.pass===pass);if(!found){alert('Wrong phone or password');return;}if(found.status!=='Active'){alert('Account Blocked by Admin');return;}localStorage.setItem('care233_current_staff',JSON.stringify(found));showDash(found);}function showDash(s){document.getElementById('loginBox').classList.add('hidden');document.getElementById('codeBox').classList.add('hidden');document.getElementById('dash').classList.remove('hidden');document.getElementById('welcome').innerText='Hi, '+s.name;document.getElementById('role').innerText=s.role+' | '+s.phone;let bookings=JSON.parse(localStorage.getItem('care233_bookings')||'[]');let html=bookings.length?'<ul>'+bookings.slice(-5).map(b=>`<li style="margin:8px 0;font-size:13px">${b.clientName} - ${b.region} - GHC${b.finalPaid}</li>`).join('')+'</ul>':'No jobs yet';document.getElementById('jobs').innerHTML=html;}function logout(){localStorage.removeItem('care233_current_staff');location.reload();}let cur=JSON.parse(localStorage.getItem('care233_current_staff')||'null');if(cur){document.getElementById('codeBox').classList.add('hidden');showDash(cur);}</script></body></html>
