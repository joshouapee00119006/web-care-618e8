<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CARE233 Staff Login</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI'}body{background:#f5f9f6;padding:20px}.box{max-width:400px;margin:60px auto;background:#fff;padding:25px;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,0.1)}input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}.btn{background:#0A4D2E;color:#fff;padding:12px;width:100%;border:none;border-radius:8px;font-weight:bold;cursor:pointer}.hidden{display:none}</style></head><body><div class="box" id="loginBox"><h2 style="color:#0A4D2E;text-align:center">👩‍⚕️ Staff Login</h2><input id="sPhone" placeholder="Phone Number"><input id="sPass" type="password" placeholder="Password"><button class="btn" onclick="staffLogin()">LOGIN</button><p style="font-size:12px;text-align:center;margin-top:10px">Get password from Admin</p><p style="font-size:11px;text-align:center;margin-top:10px"><a href="index.html">← Back to Site</a></p></div><div class="box hidden" id="dash"><h3 id="welcome"></h3><p style="font-size:13px;color:#666" id="role"></p><hr style="margin:15px 0"><h4>My Jobs</h4><div id="jobs"></div><button class="btn" style="background:#C62828;margin-top:15px" onclick="logout()">Logout</button></div><script>function staffLogin(){let phone=document.getElementById('sPhone').value,pass=document.getElementById('sPass').value;let staff=JSON.parse(localStorage.getItem('care233_staff')||'[]');let found=staff.find(s=>s.phone===phone&&s.pass===pass);if(!found){alert('Wrong phone or password');return;}if(found.status!=='Active'){alert('Blocked');return;}localStorage.setItem('care233_current_staff',JSON.stringify(found));showDash(found);}function showDash(s){document.getElementById('loginBox').classList.add('hidden');document.getElementById('dash').classList.remove('hidden');document.getElementById('welcome').innerText='Hi, '+s.name;document.getElementById('role').innerText=s.role+' | '+s.phone;let bookings=JSON.parse(localStorage.getItem('care233_bookings')||'[]');let html=bookings.length?'<ul>'+bookings.slice(-5).map(b=>`<li style="margin:8px 0;font-size:13px">${b.clientName} - ${b.region} - GHC${b.finalPaid}</li>`).join('')+'</ul>':'No jobs';document.getElementById('jobs').innerHTML=html;}function logout(){localStorage.removeItem('care233_current_staff');location.reload();}let cur=JSON.parse(localStorage.getItem('care233_current_staff')||'null');if(cur)showDash(cur);</script></body></html>
