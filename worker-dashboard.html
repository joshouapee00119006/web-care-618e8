<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CARE233 - My Offers</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>body{background:#f5f5f5;font-family:sans-serif;margin:0}.header{background:#0A4D2E;color:white;padding:15px;text-align:center}.header h1{margin:0;color:#FFD700}
.job{background:white;margin:15px;border-radius:15px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.1);border-left:6px solid #FFD700}.job.accepted{border-left-color:green;background:#e8f5e9}.btn{padding:12px 20px;border:none;border-radius:10px;font-weight:bold;margin:5px;cursor:pointer}.btn-accept{background:#22c55e;color:white}.btn-reject{background:#ef4444;color:white}.badge{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:bold}.badge-pending{background:#fef3c7;color:#92400e}.badge-accepted{background:#dcfce7;color:#166534}</style>
</head><body>
<div class="header"><h1>CARE233</h1><p>Welcome <b id="wName"></b> - <span id="wPhone"></span> <button onclick="logout()" style="background:#FFD700;border:none;padding:5px 10px;border-radius:5px;margin-left:10px">Logout</button></p></div>
<div style="padding:10px"><h2>🔔 My Job Offers (Live)</h2><div id="jobs">Loading...</div></div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",
  authDomain: "web-care-618e8.firebaseapp.com",
  projectId: "web-care-618e8",
  storageBucket: "web-care-618e8.firebasestorage.app",
  messagingSenderId: "1062578660694",
  appId: "1:1062578660694:web:f94dfe12c929df05bce2f7"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
const phone=localStorage.getItem('care233_worker_phone'), name=localStorage.getItem('care233_worker_name');
if(!phone){location.href='worker-login.html';}
document.getElementById('wName').innerText=name; document.getElementById('wPhone').innerText=phone;
function logout(){localStorage.clear(); location.href='worker-login.html';}
db.collection('jobs').where('offeredTo','array-contains',phone).orderBy('createdAt','desc').onSnapshot(snap=>{
 let html=''; if(snap.empty){html='<p>No offers yet. Keep WhatsApp on!</p>';}
 snap.forEach(doc=>{let j=doc.data(), id=doc.id; let isMine=j.acceptedBy===phone;
 html+=`<div class="job ${j.status}"><div style="display:flex;justify-content:space-between"><strong>Job #${id.slice(0,6)}</strong><span class="badge badge-${j.status}">${j.status.toUpperCase()}${j.acceptedByName?' - '+j.acceptedByName:''}</span></div>
 <h3>${j.serviceType} - ${j.location}</h3><p>📅 ${j.date} | ⏰ ${j.time} | 💰 GHC ${j.pay} + Trans GHC ${j.transport||20}</p><p>👤 ${j.clientName} - ${j.clientNote||''}</p>
 ${j.status==='pending'?`<button class="btn btn-accept" onclick="acceptJob('${id}')">✅ ACCEPT</button><button class="btn btn-reject" onclick="rejectJob('${id}','Busy')">❌ Busy</button><button class="btn btn-reject" style="background:#666" onclick="rejectJob('${id}','Too far')">📍 Too Far</button>`:isMine?'<p style="color:green;font-weight:bold">✅ YOU ACCEPTED - Check WhatsApp! We will call you.</p>':`<p>❌ Taken by ${j.acceptedByName}</p>`}</div>`; });
 document.getElementById('jobs').innerHTML=html;
});
function acceptJob(id){if(!confirm('Accept? You MUST show up!'))return;
 db.collection('jobs').doc(id).update({status:'accepted', acceptedBy:phone, acceptedByName:name, acceptedAt: firebase.firestore.FieldValue.serverTimestamp()}).then(()=>{
  let msg=`ACCEPTED JOB ${id} - Nurse ${name} (${phone}) accepted!`; window.open(`https://wa.me/233544121814?text=${encodeURIComponent(msg)}`,'_blank'); alert('✅ Accepted!'); }); }
function rejectJob(id, reason){ db.collection('jobs').doc(id).update({rejections: firebase.firestore.FieldValue.arrayUnion({phone:phone,name:name,reason:reason,at:new Date().toISOString()})}); alert('Rejected: '+reason); }
</script></body></html>
