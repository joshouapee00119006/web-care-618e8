<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CARE233 - Generate Code</title>
<style>
body{margin:0;font-family:sans-serif;background:#f0fdf4;padding:12px}
.card{background:#fff;padding:20px;border-radius:16px;max-width:400px;margin:20px auto;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
input{width:100%;padding:14px;margin:8px 0;border:2px solid #065f46;border-radius:10px;box-sizing:border-box}
button{width:100%;padding:14px;margin:8px 0;background:#065f46;color:#facc15;border:none;border-radius:10px;font-weight:bold;font-size:16px}
.linkBox{background:#fef9c3;padding:12px;border-radius:10px;border:2px dashed #ca8a04;word-break:break-all;margin:10px 0}
</style>
</head>
<body>
<div class="card">
<h2 style="color:#065f46">💰 Earn 3%</h2>
<p>Enter your MoMo number, generate link, share!</p>
<input id="name" placeholder="Your Name">
<input id="momo" placeholder="Your MoMo Number 0244...">
<button onclick="gen()">GENERATE MY LINK</button>
<div id="result" style="display:none">
<p><b>Your Code: <span id="code"></span></b></p>
<div class="linkBox" id="link"></div>
<button onclick="copyL()">📋 COPY LINK</button>
<button onclick="share()" style="background:#25D366;color:#fff">📲 SHARE LINK</button>
</div>
</div>
<script>
let finalLink='';
function gen(){
let name=document.getElementById('name').value.trim();
let momo=document.getElementById('momo').value.trim();
if(!name||!momo){alert('Put name + momo!');return;}
let code='CARE'+Math.random().toString(36).substring(2,5).toUpperCase()+Math.floor(100+Math.random()*900);
document.getElementById('code').innerText=code;
finalLink=`https://joshouapee00119006.github.io/web-care-618e8/index.html?ref=${code}&agentName=${encodeURIComponent(name)}&agentMoMo=${momo}`;
document.getElementById('link').innerText=finalLink;
document.getElementById('result').style.display='block';
localStorage.setItem('care233_my_code',code);
}
function copyL(){navigator.clipboard.writeText(finalLink);alert('Copied!');}
function share(){window.open(`https://wa.me/?text=Book CARE233 Nurse👇%0A${encodeURIComponent(finalLink)}`,'_blank');}
</script>
</body>
</html>
