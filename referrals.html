<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earn 3% - CARE233</title>
<style>
body{background:#0A4D2E;color:#FFD700;font-family:Arial;padding:20px;text-align:center}
.box{background:white;color:#0A4D2E;padding:25px;border-radius:15px;max-width:450px;margin:20px auto}
input{width:90%;padding:14px;margin:10px;border-radius:8px;border:1px solid #0A4D2E;font-size:16px}
button{background:#0A4D2E;color:#FFD700;padding:14px;width:95%;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:10px}
#result{margin-top:15px;background:#0A4D2E;color:#FFD700;padding:15px;border-radius:8px;word-break:break-all;display:none}
</style>
</head>
<body>
<h1>💰 EVERYONE CAN EARN 3%</h1>
<p>Not just bloggers! Anyone can refer and earn via MoMo</p>
<div class="box">
<h3>Generate Your Link in 5 Secs</h3>
<input id="name" placeholder="Your Name e.g. Kofi">
<input id="momo" placeholder="Your MoMo Number 054...">
<button onclick="genLink()">Generate My Link</button>
<div id="result"></div>
<button id="copyBtn" style="display:none" onclick="copyLink()">📋 Copy Link</button>
<button id="shareBtn" style="display:none;background:#25D366;color:white;padding:14px;width:95%;border:none;border-radius:8px;margin-top:10px;font-weight:bold" onclick="shareWA()">📱 Share on WhatsApp</button>
<a href="index.html" style="display:block;margin-top:15px;color:#0A4D2E;font-weight:bold">← Back to Booking</a>
</div>
<script>
function genLink(){
 let n=document.getElementById('name').value.trim().replace(/\s+/g,'').toUpperCase();
 let m=document.getElementById('momo').value.trim().slice(-4);
 if(!n || m.length<4){alert('Enter Name and MoMo');return}
 let code=n+m; let link="https://joshouapee00119006.github.io/web-care-618e8/?ref="+code;
 let r=document.getElementById('result'); r.style.display='block';
 r.innerHTML="✅ Code: <b>"+code+"</b><br><br>Link:<br><b>"+link+"</b><br><br>Share! When they book, you earn 3%!";
 r.dataset.link=link; document.getElementById('shareBtn').style.display='block'; document.getElementById('copyBtn').style.display='block';
}
function shareWA(){let link=document.getElementById('result').dataset.link; window.open("https://wa.me/?text="+encodeURIComponent("Need a nurse? Book CARE233 here: "+link));}
function copyLink(){navigator.clipboard.writeText(document.getElementById('result').dataset.link).then(()=>alert("✅ Copied! Share now"));}
</script>
</body>
</html>
