<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CARE233 Admin - See Referral MoMo</title>
<style>
body{margin:0;font-family:sans-serif;background:#f0fdf4;padding:10px}
.card{background:#fff;padding:12px;border-radius:12px;margin:10px 0;box-shadow:0 2px 6px rgba(0,0,0,0.1)}
table{width:100%;border-collapse:collapse;font-size:11px}
th,td{border:1px solid #ccc;padding:6px;text-align:left}
th{background:#065f46;color:#facc15}
button{padding:10px;background:#065f46;color:#facc15;border:none;border-radius:8px;font-weight:bold;margin:4px}
.earn{background:#fef9c3;padding:10px;border-radius:8px;border:2px solid #ca8a04;margin:8px 0}
</style>
</head>
<body>
<h2 style="color:#065f46;text-align:center">CARE233 Admin - Referral MoMo Pay</h2>
<div class="card">
<button onclick="load()">🔄 Refresh</button>
<button onclick="clearAll()" style="background:#dc2626;color:#fff">🗑️ Clear</button>
<div id="report"></div>
</div>
<div class="card">
<table><thead><tr><th>Date</th><th>Ref</th><th>Agent Name</th><th>Agent MoMo</th><th>Total</th><th>Pay 3%</th></tr></thead><tbody id="body"></tbody></table>
</div>
<script>
function load(){
let bookings=JSON.parse(localStorage.getItem('care233_bookings')||'[]');
let tbody=document.getElementById('body');
tbody.innerHTML='';
let map={};
bookings.forEach(b=>{
let code=b.refCode||'DIRECT';
let name=b.agentName||'-';
let momo=b.agentMoMo||'-';
let total=parseFloat(b.total||0);
let earn=(total*0.03).toFixed(2);
if(!map[code]) map[code]={name:name,momo:momo,count:0,earn:0};
map[code].count++; map[code].earn+=parseFloat(earn);
let tr=document.createElement('tr');
tr.innerHTML=`<td>${b.date||''}</td><td><b>${code}</b></td><td>${name}</td><td style="color:green;font-weight:bold">${momo}</td><td>GHS ${total}</td><td>GHS ${earn}</td>`;
tbody.appendChild(tr);
});
let rep=document.getElementById('report');
let html='<h3>💰 Who To Pay MoMo:</h3>';
for(let c in map){
if(c==='DIRECT') continue;
let d=map[c];
html+=`<div class="earn"><b>Code: ${c}</b><br>Name: ${d.name}<br>MoMo: <b style="font-size:18px">${d.momo}</b><br>${d.count} bookings = <b>GHS ${d.earn.toFixed(2)} to PAY</b><br><button onclick="window.open('https://wa.me/${d.momo}?text=Hi ${d.name}, your CARE233 code ${c} earned GHS ${d.earn.toFixed(2)} - Sending MoMo now!','_blank')" style="background:#25D366">📲 Pay MoMo Now</button></div>`;
}
rep.innerHTML=html||'No referral bookings yet';
}
function clearAll(){if(confirm('Clear all?')){localStorage.removeItem('care233_bookings');load();}}
load();
</script>
</body>
</html>
