<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WEB CARE HEALTH</title><script src="https://js.paystack.co/v1/inline.js"></script><script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBIS_U0IqFtyIPPRjCMZpoW-T7NLYaqSsc&libraries=places"></script><style>*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#f0fdfa;padding:12px}.hdr{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;padding:20px;border-radius:16px;text-align:center}.card{background:#fff;padding:14px;border-radius:12px;margin-top:10px;box-shadow:0 2px 8px rgba(0,0,0,.06)}.pay{background:#0f766e;color:#fff;width:100%;padding:12px;border:0;border-radius:10px;font-weight:800;margin-top:8px}.wa{background:#22c55e;color:#fff;display:block;text-align:center;padding:10px;border-radius:10px;text-decoration:none;font-weight:700;margin-top:6px}.nav{background:#4285F4;color:#fff;display:block;text-align:center;padding:12px;border-radius:10px;text-decoration:none;font-weight:800;margin-top:6px}input,select{width:100%;padding:11px;margin-top:7px;border:1px solid #ddd;border-radius:9px}.fee{font-size:12px;background:#f0fdfa;padding:6px;border-radius:6px;margin-top:6px}</style></head><body>
<div class="hdr"><h1>WEB CARE HEALTH</h1><p>Workers Locate Clients Easily</p></div><div id="list"></div>
<div class="card"><h3>👤 Client: Enter YOUR Location</h3><select id="wSelect"></select>
<input id="cLocation" placeholder="Your Location - e.g. Cantonments, Accra">
<input id="days" type="number" placeholder="Days e.g 2"><input id="rate" type="number" placeholder="Rate"><input id="cEmail" placeholder="Your Email"><input id="cPhone" placeholder="Your Phone">
<div id="calc" class="fee">Select worker</div><button class="pay" onclick="payNow()">Pay & Share Location</button><p id="msg"></p></div>
<div class="card" style="background:#1e293b;color:#fff"><h3>👩‍⚕️ Worker Registration</h3><input id="rName" placeholder="Name"><select id="rRole"><option value="">Role</option><option>Nurse</option><option>Caregiver</option><option>Midwife</option></select><input id="rLocation" placeholder="Your Base - e.g East Legon"><input id="rPhone" placeholder="WhatsApp 233..."><input id="rEmail" placeholder="Email"><input id="rRate" type="number" placeholder="Rate GHS"><button class="pay" style="background:#14b8a6" onclick="reg()">Register</button><p id="rMsg"></p></div>
<div class="card"><h3>📋 Bookings - Navigate to Client</h3><div id="bookings">No bookings yet</div></div>
<script>
const PK="pk_live_baf2c021aeb947445f9d53ed0ee3fd3e47acaf18";let workers=JSON.parse(localStorage.getItem('webcare_w')||'[]'); if(!workers.length)workers=[{name:"Grace Mensah",role:"Nurse",location:"East Legon, Accra",phone:"233244123456",rate:150,lat:5.635,lng:-0.16}];let bookings=JSON.parse(localStorage.getItem('webcare_b')||'[]');let wLat,wLng,cLat,cLng;function init(){try{let aW=new google.maps.places.Autocomplete(document.getElementById('rLocation'),{componentRestrictions:{country:"gh"}});aW.addListener('place_changed',()=>{let p=aW.getPlace();if(p.geometry){wLat=p.geometry.location.lat();wLng=p.geometry.location.lng();document.getElementById('rLocation').value=p.formatted_address;}});let aC=new google.maps.places.Autocomplete(document.getElementById('cLocation'),{componentRestrictions:{country:"gh"}});aC.addListener('place_changed',()=>{let p=aC.getPlace();if(p.geometry){cLat=p.geometry.location.lat();cLng=p.geometry.location.lng();document.getElementById('cLocation').value=p.formatted_address;}});}catch(e){}}window.addEventListener('load',init);
function saveW(){localStorage.setItem('webcare_w',JSON.stringify(workers));}function saveB(){localStorage.setItem('webcare_b',JSON.stringify(bookings));}
function render(){let h="",o="<option value=''>Choose worker</option>";workers.forEach((w,i)=>{h+=`<div class="card"><b>${w.name}</b> ${w.role} - ${w.location}</div>`;o+=`<option value="${i}">${w.name}</option>`;});document.getElementById('list').innerHTML=h;document.getElementById('wSelect').innerHTML=o;let bh="";bookings.slice().reverse().forEach(b=>{let dir=`https://www.google.com/maps/dir/${b.wLat||''},${b.wLng||''}/${b.cLat},${b.cLng}`;bh+=`<div class="fee" style="padding:10px;margin-top:8px"><b>${b.workerName}</b> → Client: ${b.clientPhone}<br>📍 ${b.clientLoc}<br><a class="nav" target="_blank" href="${dir}">🗺️ NAVIGATE TO CLIENT</a></div>`;});document.getElementById('bookings').innerHTML=bh||"No bookings yet";}
function calc(){let r=parseInt(document.getElementById('rate').value)||0,d=parseInt(document.getElementById('days').value)||0;if(!r||!d)return null;let tot=d*r;document.getElementById('calc').innerHTML=`Total GHS ${tot}`;return{tot};}
document.getElementById('wSelect').addEventListener('change',function(){let w=workers[this.value];if(w){document.getElementById('rate').value=w.rate;wLat=w.lat;wLng=w.lng;}calc();});document.getElementById('days').addEventListener('input',calc);
function reg(){let n=document.getElementById('rName').value,role=document.getElementById('rRole').value,loc=document.getElementById('rLocation').value,ph=document.getElementById('rPhone').value,rt=parseInt(document.getElementById('rRate').value);if(!n||!role||!loc||!ph||!rt)return;workers.push({name:n,role:role,location:loc,phone:ph,rate:rt,lat:wLat||null,lng:wLng||null});saveW();render();document.getElementById('rMsg').innerText="Registered";}
function payNow(){let d=calc(),email=document.getElementById('cEmail').value,cLoc=document.getElementById('cLocation').value,cPhone=document.getElementById('cPhone').value,idx=document.getElementById('wSelect').value;if(!d||!cLoc||!cPhone||idx==="")return;let w=workers[idx];let h=PaystackPop.setup({key:PK,email:email||"client@test.com",amount:d.tot*100,currency:"GHS",ref:"WEBCARE_"+Date.now(),callback:function(res){let bk={workerName:w.name,wLat:w.lat,wLng:w.lng,clientLoc:cLoc,clientPhone:cPhone,cLat:cLat,cLng:cLng,amount:d.tot,ref:res.reference};bookings.push(bk);saveB();render();document.getElementById('msg').innerHTML="✅ Paid! Worker can navigate to you";},onClose:function(){}});h.openIframe();}
render();
</script></body></html>
