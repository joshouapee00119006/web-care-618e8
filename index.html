<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WEB CARE HEALTH</title><script src="https://js.paystack.co/v1/inline.js"></script><style>*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#f0fdfa;padding:10px}.hdr{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;padding:20px;border-radius:18px;text-align:center}.card{background:#fff;padding:14px;border-radius:14px;margin-top:10px;box-shadow:0 2px 8px rgba(0,0,0,.07)}.pay{background:#0f766e;color:#fff;width:100%;padding:12px;border:0;border-radius:10px;font-weight:800;margin-top:8px}.fee{font-size:12px;background:#f0fdfa;padding:6px;border-radius:6px;margin-top:6px}input,select{width:100%;padding:11px;margin-top:7px;border:1px solid #ddd;border-radius:9px}.wa{background:#22c55e;color:#fff;display:block;text-align:center;padding:10px;border-radius:10px;text-decoration:none;font-weight:700;margin-top:8px}</style></head><body><div class="hdr"><h1>WEB CARE HEALTH</h1><p>Pay Online - 15% to Platform</p></div><div id="list"></div><div class="card"><h3>Book & Pay</h3><select id="w"></select><input id="days" type="number" placeholder="Days e.g 3"><input id="rate" type="number" placeholder="Rate GHS"><input id="email" type="email" placeholder="Client Email"><div id="breakdown" class="fee">Select worker</div><button class="pay" onclick="payNow()">Pay Now With Paystack</button><p id="m"></p></div><script>
let workers=[{name:"Grace Mensah",role:"Nurse",location:"Accra",phone:"233244123456",rate:150},{name:"Kwame Asare",role:"Caregiver",location:"Kumasi",phone:"233245654321",rate:120}];
const PAYSTACK_PUBLIC_KEY="pk_live_baf2c021aeb947445f9d53ed0ee3fd3e47acaf18";
function render(){let h="",o="<option>Choose worker</option>";workers.forEach((w,i)=>{let t=w.rate*3,f=Math.round(t*0.15),wg=t-f;h+=`<div class="card"><b>${w.name}</b> - ${w.role}<br><small>${w.location} - GHS ${w.rate}/day</small><div class="fee">3 days: GHS ${t} | Fee 15%: GHS ${f} | Worker: GHS ${wg}</div><a class="wa" href="https://wa.me/${w.phone}">WhatsApp</a><button class="pay" onclick="quickPay(${i})">Pay GHS ${t} Online</button></div>`;o+=`<option value="${i}">${w.name}</option>`;});document.getElementById("list").innerHTML=h;document.getElementById("w").innerHTML=o;}
function calc(){let i=document.getElementById("w").value,d=parseInt(document.getElementById("days").value)||1,r=parseInt(document.getElementById("rate").value)||0;if(!r)return;let total=d*r,fee=Math.round(total*0.15),wg=total-fee;document.getElementById("breakdown").innerHTML=`Total: GHS ${total} | Fee (15%): GHS ${fee} → YOU | Worker: GHS ${wg}`;return{total,fee,wg};}
document.getElementById("days").addEventListener("input",calc);document.getElementById("rate").addEventListener("input",calc);document.getElementById("w").addEventListener("change",function(){let w=workers[this.value];if(w)document.getElementById("rate").value=w.rate;calc();});
function payNow(){let data=calc(),email=document.getElementById("email").value;if(!data||!email){document.getElementById("m").innerText="Select worker, days, email";return}let handler=PaystackPop.setup({key:PAYSTACK_PUBLIC_KEY,email:email,amount:data.total*100,currency:"GHS",ref:"WEBCARE_"+Date.now(),callback:function(res){document.getElementById("m").innerHTML="✅ Success! Ref: "+res.reference+"<br>Fee GHS "+data.fee+" in YOUR Paystack";},onClose:function(){document.getElementById("m").innerText="Cancelled"}});handler.openIframe();}
function quickPay(i){document.getElementById("w").value=i;document.getElementById("days").value=3;document.getElementById("rate").value=workers[i].rate;calc();window.scrollTo(0,9999);}
render();
</script></body></html>
