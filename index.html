<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CARE233 - Home Nursing</title>
<style>
body{background:#0a2e1f;color:white;font-family:Arial;padding:10px;margin:0}
.top{display:flex;gap:10px;margin-bottom:10px}
.btnTop{flex:1;padding:14px;border-radius:12px;border:none;font-weight:bold;font-size:16px}
.btn1{background:#0a4d2e;color:#ffcc00} .btn2{background:#2a2a2a;color:white}
.card{background:#111;padding:20px;border-radius:20px}
input,select{width:100%;padding:14px;margin:8px 0;border-radius:12px;border:2px solid #2a8a6a;background:#222;color:white;box-sizing:border-box}
.gpsBox{display:flex;gap:8px}
.gpsBtn{padding:14px;background:#ffcc00;color:#000;border:none;border-radius:12px;font-weight:bold;white-space:nowrap}
.book{width:100%;padding:16px;background:#0a4d2e;color:#ffcc00;border:none;border-radius:12px;font-weight:bold;font-size:18px;margin-top:12px}
.small{font-size:13px;color:#8fbc8f}
.link{color:#25D366;text-decoration:none}
</style>
</head>
<body>
<div class="top">
<button class="btnTop btn1">📋 Book Nurse</button>
<button class="btnTop btn2" onclick="alert('Share to earn 3%')">💰 Earn 3%</button>
</div>

<div class="card">
<h2 style="color:#7fdbc0;margin:0;text-align:center">CARE233 - Home Nursing</h2>
<p id="gpsStatus" class="small">📍 Click GPS button to lock location</p>

<div class="gpsBox">
<input id="loc" placeholder="East Legon, Accra *">
<button class="gpsBtn" onclick="getGPS()">📍 GPS</button>
</div>
<input id="gpsCoords" type="hidden">
<a id="mapLink" class="small link" target="_blank" style="display:none">🗺️ View / Directions on Google Map</a>

<label>Care Type</label>
<select id="care" onchange="calc()">
<option value="1400">2 Weeks - GHS 1400</option>
<option value="2800">1 Month - GHS 2800</option>
<option value="700">1 Week - GHS 700</option>
<option value="200">1 Day - GHS 200</option>
</select>

<label>Your Phone</label>
<input id="phone" placeholder="0244...">

<div style="background:#132a20;padding:12px;border-radius:12px;margin-top:10px">
<div>Care: <b>GHS <span id="carePrice">1400</span></b></div>
<div style="margin-top:5px">Total: <b>GHS <span id="totalPrice">1400</span></b> | Agent earns: GHS <span id="earn">42.00</span></div>
<p class="small" style="margin:5px 0 0">* No transport fee. GPS is for nurse directions only.</p>
</div>

<button class="book" onclick="book()">📲 BOOK NOW</button>
<p id="msg" class="small"></p>
</div>

<script>
function calc(){
 let p=document.getElementById('care').value;
 document.getElementById('carePrice').innerText=p;
 document.getElementById('totalPrice').innerText=p;
 document.getElementById('earn').innerText=(p*0.03).toFixed(2);
}
calc();

function getGPS(){
 let s=document.getElementById('gpsStatus');
 s.innerText='⏳ Getting GPS...';
 navigator.geolocation.getCurrentPosition(pos=>{
   let lat=pos.coords.latitude.toFixed(6);
   let lng=pos.coords.longitude.toFixed(6);
   document.getElementById('gpsCoords').value=lat+','+lng;
   document.getElementById('loc').value=document.getElementById('loc').value || 'My Current Location';
   s.innerText='✅ GPS Locked: '+lat+','+lng;
   let link=document.getElementById('mapLink');
   link.href='https://www.google.com/maps?q='+lat+','+lng;
   link.style.display='block';
 }, err=>{
   s.innerText='❌ GPS failed: '+err.message+' - Type location manually';
 }, {enableHighAccuracy:true, timeout:10000});
}

function book(){
 let phone=document.getElementById('phone').value.trim();
 let location=document.getElementById('loc').value.trim();
 let coords=document.getElementById('gpsCoords').value;
 let careSelect=document.getElementById('care');
 let careText=careSelect.options[careSelect.selectedIndex].text;
 let total=document.getElementById('totalPrice').innerText;
 if(!phone||!location){document.getElementById('msg').innerText='Enter phone & location';return}
 let jobs=JSON.parse(localStorage.getItem('care233_jobs')||'[]');
 jobs.push({service:careText, location:location, gps:coords, phone:phone, price:total, desc:'Phone:'+phone+' GPS:'+coords+' Loc:'+location, date:new Date().toLocaleString()});
 localStorage.setItem('care233_jobs',JSON.stringify(jobs));
 let waMsg='CARE233 Booking%0A'+careText+'%0APhone:'+phone+'%0ALocation:'+encodeURIComponent(location)+'%0AGPS:'+encodeURIComponent(coords)+'%0AMap:https://www.google.com/maps?q='+encodeURIComponent(coords)+'%0ATotal:GHS'+total;
 window.open('https://wa.me/233554466448?text='+waMsg,'_blank');
 document.getElementById('msg').innerText='✅ Booked! We will call you. GPS saved for directions.';
}
</script>
</body>
</html>
