<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CARE233 - Home Nursing</title>
<style>
body{margin:0;font-family:sans-serif;background:#f0fdf4;padding:10px}
.card{background:#fff;padding:18px;border-radius:16px;max-width:500px;margin:12px auto;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
input,select{width:100%;padding:12px;margin:8px 0;border:2px solid #065f46;border-radius:10px;box-sizing:border-box}
button{width:100%;padding:14px;background:#065f46;color:#facc15;border:none;border-radius:10px;font-weight:bold;margin:8px 0;font-size:16px}
.bonus{background:#fef9c3;border:2px solid #ca8a04;padding:10px;border-radius:10px;text-align:center}
</style>
</head>
<body>
<div class="card">
<h2 style="color:#065f46;text-align:center">CARE233 - Book Nurse</h2>
<div id="refBanner" style="display:none" class="bonus">
✅ <b>3% Bonus Applied</b><br>Code: <span id="refCodeShow"></span> | Agent: <span id="refNameShow"></span>
</div>

<label>GPS Distance (km) - Auto</label>
<input id="gps" value="10.0" readonly>

<label>Care Type</label>
<select id="careType">
<option value="2 Weeks - GHS 1400">2 Weeks - GHS 1400</option>
<option value="1 Week - GHS 700">1 Week - GHS 700</option>
<option value="3 Days - GHS 350">3 Days - GHS 350</option>
<option value="Monthly - GHS 2800">Monthly - GHS 2800</option>
</select>

<label>Your Phone Number</label>
<input id="clientPhone" placeholder="Your number 0244...">

<label>Your Location</label>
<input id="location" placeholder="e.g. East Legon, Accra">

<div class="card" style="background:#f0fdf4;margin:10px 0">
<p>Care: <b id="carePrice">GHS 1400</b></p>
<p>Transport: GHS <span id="trans">20</span> - <span id="km">10.0</span>km</p>
<p>Total: <b>GHS <span id="total">1420</span></b></p>
</div>

<button onclick="book()">📲 BOOK NOW - Pay on Delivery</button>
<p style="text-align:center"><a href="referrals.html">Want to Earn 3%? Generate Your Link</a></p>
</div>

<script>
// --- CAPTURE REFERRAL FROM LINK ---
let params = new URLSearchParams(window.location.search);
let refCode = params.get('ref') || 'DIRECT';
let agentName = params.get('agentName') ? decodeURIComponent(params.get('agentName')) : '';
let agentMoMo = params.get('agentMoMo') || '';

if(refCode !== 'DIRECT'){
 document.getElementById('refBanner').style.display='block';
 document.getElementById('refCodeShow').innerText=refCode;
 document.getElementById('refNameShow').innerText=agentName+' - '+agentMoMo;
}

// --- CALCULATE TOTAL ---
let basePrice=1400;
document.getElementById('careType').addEventListener('change',function(){
 let val=this.value;
 if(val.includes('1400')) basePrice=1400;
 else if(val.includes('700')) basePrice=700;
 else if(val.includes('350')) basePrice=350;
 else if(val.includes('2800')) basePrice=2800;
 document.getElementById('carePrice').innerText='GHS '+basePrice;
 calcTotal();
});
function calcTotal(){
 let total=basePrice+20;
 document.getElementById('total').innerText=total;
 return total;
}

// --- BOOKING SAVE WITH MOMO ---
function book(){
 let phone=document.getElementById('clientPhone').value.trim();
 let loc=document.getElementById('location').value.trim();
 let care=document.getElementById('careType').value;
 if(!phone){alert('Enter your phone!');return;}
 let total=calcTotal();
 let booking={
   date:new Date().toLocaleString(),
   service:'Home Nursing',
   careType:care,
   total:total,
   phone:phone,
   location:loc,
   gps:'10.0km',
   refCode:refCode,
   agentName:agentName,
   agentMoMo:agentMoMo,
   earn:(total*0.03).toFixed(2)
 };
 let bookings=JSON.parse(localStorage.getItem('care233_bookings')||'[]');
 bookings.push(booking);
 localStorage.setItem('care233_bookings',JSON.stringify(bookings));

 // AUTO WHATSAPP TO ADMIN WITH AGENT MOMO
 let adminNumber='233544121814'; // CHANGE TO YOUR NUMBER
 let msg=`NEW BOOKING CARE233%0A%0AService: ${care}%0ATotal: GHS ${total}%0AClient Phone: ${phone}%0ALocation: ${loc}%0A%0AREFERRAL CODE: ${refCode}%0AAgent Name: ${agentName}%0AAgent MoMo to PAY: ${agentMoMo}%0AEarn 3%: GHS ${booking.earn}%0A%0AGPS: 10km`;
 window.open(`https://wa.me/${adminNumber}?text=${msg}`,'_blank');
 
 alert(`✅ Booked! Total GHS ${total}\nReferral: ${refCode}\nAgent MoMo: ${agentMoMo}\nAdmin will contact you!`);
 window.location.href='admin.html';
}
</script>
</body>
</html>
