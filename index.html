<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WEB CARE HEALTH</title><style>*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#f0fdfa;padding:10px}.hdr{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;padding:22px;border-radius:18px;text-align:center}.srch input{width:100%;padding:14px;border-radius:12px;border:2px solid #99f6e0;font-size:16px}.card{background:#fff;padding:14px;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.07);margin-top:10px}.wa{background:#22c55e;color:#fff;display:block;text-align:center;padding:10px;border-radius:10px;text-decoration:none;font-weight:700;margin-top:8px}.btn{width:100%;padding:12px;background:#0f766e;color:#fff;border:0;border-radius:10px;font-weight:700}input{width:100%;padding:11px;margin-top:7px;border:1px solid #ddd;border-radius:9px}</style></head><body><div class="hdr"><h1 style="margin:0">WEB CARE HEALTH</h1><p>Trusted Home Nurses in Ghana</p></div><div style="margin:12px 0"><input id="s" placeholder="Search nurse, Accra..."></div><div id="list"></div><div class="card"><h3>Add Worker</h3><input id="n" placeholder="Name"><input id="r" placeholder="Role"><input id="l" placeholder="Location"><input id="p" placeholder="WhatsApp 233..."><button class="btn" onclick="add()">Add Worker</button><p id="m"></p></div><script>let workers=[{name:"Grace Mensah",role:"Registered Nurse",location:"Accra",phone:"233244123456"},{name:"Kwame Asare",role:"Caregiver",location:"Kumasi",phone:"233245654321"}];function render(a){let h="";a.forEach(w=>{h+=`<div class="card"><b>${w.name}</b> - ${w.role}<br>${w.location}<a class="wa" href="https://wa.me/${w.phone}">WhatsApp Chat</a></div>`});document.getElementById("list").innerHTML=h}function add(){let w={name:n.value,role:r.value,location:l.value,phone:p.value};if(!w.name||!w.phone){m.innerText="Enter name & phone";return}workers.unshift(w);render(workers);m.innerText="Added!"};s.addEventListener("input",e=>{let q=e.target.value.toLowerCase();render(workers.filter(x=>(x.name+x.role+x.location).toLowerCase().includes(q)))});render(workers);</script></body></html>
