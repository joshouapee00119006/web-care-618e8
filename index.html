<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nurses Group - Book a Nurse</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
body{background:#050a07;color:white;font-family:Arial;padding:10px;margin:0}
.card{background:#111;padding:16px;border-radius:20px;max-width:480px;margin:20px auto;border:1px solid #0a4d2e;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
.top{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:15px}
.icon{width:50px;height:50px;background:#0a4d2e;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#ffcc00;font-size:20px;border:2px solid #ffcc00}
h2{color:#ffcc00;margin:0;text-align:center}
.small{font-size:12px;color:#8fbc8f;text-align:center;margin:2px}
label{font-size:13px;color:#7fdbc0;margin-top:10px;display:block;font-weight:bold}
input,select,textarea{width:100%;padding:14px;margin:6px 0 12px 0;border-radius:12px;border:2px solid #2a8a6a;background:#1e2e24;color:white;box-sizing:border-box;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:#ffcc00;outline:none}
.btn{width:100%;padding:16px;border:none;border-radius:12px;font-weight:bold;font-size:18px;cursor:pointer;margin-top:10px}
.green{background:#0a4d2e;color:#ffcc00;border:2px solid #ffcc00}
.green:active{background:#0d5a35}
.success{background:#0a4d2e;border:1px solid #ffcc00;padding:20px;border-radius:15px;text-align:center;display:none}
</style>
</head>
<body>

<div class="card">
<div class="top">
<div class="icon">NG</div>
<div><h2>NURSES GROUP</h2><p class="small">Professional Home Nursing in Ghana</p></div>
</div>

<div id="formArea">
<h3 style="color:#7fdbc0;text-align:center;margin:10px 0">📋 Book a Professional Nurse</h3>

<label>👤 Your Full Name</label>
<input id="cName" placeholder="e.g. Sarah Mensah">

<label>📞 Phone Number (WhatsApp)</label>
<input id="cPhone" placeholder="e.g. 0551234567" type="tel">

<label>💉 Service Needed</label>
<select id="cService">
<option value="Home Nursing">Home Nursing</option>
<option value="Elderly Care">Elderly Care</option>
<option value="Baby / Nanny Care">Baby / Nanny Care</option>
<option value="Post-Surgery Care">Post-Surgery Care</option>
<option value="Injection / Wound Dressing">Injection / Wound Dressing</option>
<option value="Physiotherapy">Physiotherapy</option>
<option value="Hospital Accompaniment">Hospital Accompaniment</option>
<option value="Other">Other</option>
</select>

<label>📍 Location / Area</label>
<input id="cLocation" placeholder="e.g. East Legon, Accra">

<label>🗺️ GPS Location (Optional - for easy finding)</label>
<input id="cGPS" placeholder="e.g. 5.6358, -0.1613">

<label>📝 Additional Notes</label>
<textarea id="cNotes" rows="3" placeholder="Tell us about patient condition, time needed..."></textarea>

<button class="btn green" onclick="submitBookingToFirebase()">🔔 BOOK NOW - Staff Will Call You</button>

<p class="small" style="margin-top:15px">⚡ Real-time booking • Staff receives instantly • 24/7 Service<br>📞 Emergency: <a href="tel:+233000000000" style="color:#ffcc00">Call Us</a></p>
</div>

<div id="successArea" class="success">
<h2 style="color:#ffcc00">✅ BOOKING SENT!</h2>
<p>Thank you <b id="sName"></b>!</p>
<p>Your booking for <b id="sService"></b> has been sent LIVE to our Staffs!</p>
<p style="font-size:18px">📞 Our staff will call you at <b id="sPhone" style="color:#ffcc00"></b> in <b>5 minutes!</b></p>
<p class="small" id="sTime"></p>
<button class="btn green" onclick="bookAnother()">+ Book Another</button>
</div>

</div>

<script>
// YOUR FIREBASE - web-care-618e8
const firebaseConfig = {
  apiKey: "AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",
  authDomain: "web-care-618e8.firebaseapp.com",
  databaseURL: "https://web-care-618e8-default-rtdb.firebaseio.com",
  projectId: "web-care-618e8",
  storageBucket: "web-care-618e8.firebasestorage.app",
  messagingSenderId: "1062578660694",
  appId: "1:1062578660694:web:f94dfe12c929df05bce2f7"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function submitBookingToFirebase(){
  let name = document.getElementById('cName').value.trim();
  let phone = document.getElementById('cPhone').value.trim();
  let service = document.getElementById('cService').value;
  let location = document.getElementById('cLocation').value.trim();
  let gps = document.getElementById('cGPS').value.trim();
  let notes = document.getElementById('cNotes').value.trim();

  if(!name){alert('Please enter your name');return}
  if(!phone){alert('Please enter phone number');return}
  if(!location){alert('Please enter location');return}

  let booking = {
    name: name,
    phone: phone,
    service: service,
    location: location,
    gps: gps,
    notes: notes,
    price: "To be discussed",
    date: new Date().toLocaleString(),
    timestamp: Date.now(),
    status: 'new'
  };

  // Disable button
  let btn = document.querySelector('.btn.green');
  let oldText = btn.innerHTML;
  btn.innerHTML = '⏳ Sending...';
  btn.disabled = true;

  db.ref('bookings').push(booking).then(()=>{
    // Show success
    document.getElementById('formArea').style.display='none';
    document.getElementById('successArea').style.display='block';
    document.getElementById('sName').innerText = name;
    document.getElementById('sService').innerText = service;
    document.getElementById('sPhone').innerText = phone;
    document.getElementById('sTime').innerText = new Date().toLocaleString();
    
    if(navigator.vibrate) navigator.vibrate([200,100,200]);

    btn.innerHTML = oldText;
    btn.disabled = false;
  }).catch(e=>{
    alert('Error: '+e.message+'\n\nPlease check internet and try again');
    btn.innerHTML = oldText;
    btn.disabled = false;
  });
}

function bookAnother(){
  document.getElementById('formArea').style.display='block';
  document.getElementById('successArea').style.display='none';
  document.getElementById('cName').value='';
  document.getElementById('cPhone').value='';
  document.getElementById('cLocation').value='';
  document.getElementById('cGPS').value='';
  document.getElementById('cNotes').value='';
}
</script>

</body>
</html>
