<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WEB CARE HEALTH - With History</title><script src="https://js.paystack.co/v1/inline.js"></script><style>*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#020617;color:#fff;padding:10px}.hdr{background:linear-gradient(135deg,#0f766e,#06b6d4);padding:16px;border-radius:14px;text-align:center}.card{background:#1e293b;padding:11px;border-radius:12px;margin-top:10px;border:1px solid #334155}.tab{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}.tab button{flex:1;min-width:60px;padding:8px;border-radius:8px;border:0;font-weight:800;font-size:11px}.on{background:#14b8a6;color:#fff}.off{background:#334155;color:#aaa}.pay{background:#0f766e;color:#fff;width:100%;padding:10px;border:0;border-radius:10px;font-weight:800;margin-top:6px}.loc{background:#3b82f6;color:#fff;padding:8px;border:0;border-radius:8px;font-size:11px}.nav{background:#3b82f6;color:#fff;display:block;text-align:center;padding:8px;border-radius:8px;text-decoration:none;font-weight:700;margin-top:5px;font-size:12px}.badge{background:#22c55e;padding:2px 7px;border-radius:20px;font-size:9px;color:#fff}.onlineDot{width:9px;height:9px;background:#22c55e;border-radius:50%;display:inline-block;animation:blink 1s infinite}.offlineDot{width:9px;height:9px;background:#64748b;border-radius:50%;display:inline-block}@keyframes blink{0%{opacity:1}50%{opacity:0.3}}input,select,textarea{width:100%;padding:8px;margin-top:5px;border:1px solid #475569;border-radius:8px;background:#0f172a;color:#fff;font-size:12px}.fee{font-size:11px;background:#0f172a;padding:6px;border-radius:6px;margin-top:5px;color:#94a3b8}.histItem{background:#020617;border:1px solid #1e293b;padding:8px;border-radius:8px;margin-top:6px;font-size:11px}.histItem b{color:#14b8a6}#videoBox{width:100%;height:280px;background:#000;border-radius:10px;margin-top:6px}#chatBox{height:120px;overflow-y:auto;background:#020617;padding:6px;border-radius:8px;margin-top:5px;border:1px solid #334155;font-size:11px}</style></head><body>
<div class="hdr"><h1>WEB CARE HEALTH</h1><small>✅ Verified • 🟢 Online • 📹 Video • 📜 History</small></div>
<div class="tab"><button id="t1" class="on" onclick="showTab(1)">🏠 Care</button><button id="t2" class="off" onclick="showTab(2)">👨‍⚕️ Video</button><button id="t3" class="off" onclick="showTab(3)">🔐 Admin</button><button id="t4" class="off" onclick="showTab(4)">📜 History</button></div>

<div id="tab1"><div style="display:flex;gap:5px;margin-top:7px"><button class="loc" style="flex:1" onclick="filterOnline=true;render()">🟢 Online Only</button><button class="loc" style="flex:1;background:#475569" onclick="filterOnline=false;render()">👁️ All</button></div><div id="list"></div><div class="card"><h3>👤 Book Worker</h3><select id="wSelect" onchange="viewProfile()"></select><div id="profileView"></div><div style="display:flex;gap:5px"><input id="cLocation" placeholder="Your Location" style="flex:1"><button class="loc" onclick="getLoc('c')">📍</button></div><input id="days" type="number" placeholder="Days"><input id="rate" type="number" placeholder="Rate"><input id="cEmail" placeholder="Email"><input id="cPhone" placeholder="Phone 233.."><div id="calc" class="fee">Select worker</div><button class="pay" onclick="payNow()">Pay & Share Location</button><p id="msg"></p></div><div class="card"><h3>👩‍⚕️ Join + Docs</h3><input id="rName" placeholder="Full Name"><select id="rRole"><option value="">Role</option><option>Nurse</option><option>Caregiver</option><option>Midwife</option><option>Doctor</option></select><div style="display:flex;gap:5px"><input id="rLocation" placeholder="Base Location" style="flex:1"><button class="loc" onclick="getLoc('w')">📍</button></div><input id="rPhone" placeholder="WhatsApp 233.."><input id="rExp" type="number" placeholder="Years Exp"><input id="rLang" placeholder="Languages"><textarea id="rBio" placeholder="About you"></textarea><input id="rRate" type="number" placeholder="Rate/day"><label style="font-size:10px;color:#94a3b8">📄 CV</label><input id="rCV" type="file" accept="image/*,.pdf"><label style="font-size:10px;color:#94a3b8">🪪 Ghana Card</label><input id="rCard" type="file" accept="image/*,.pdf"><label style="font-size:10px;color:#94a3b8">🎓 License</label><input id="rLicense" type="file" accept="image/*,.pdf"><select id="rStatus"><option value="online">🟢 Online Now</option><option value="offline">🔴 Offline</option></select><button class="pay" onclick="reg()">📤 Submit for Approval</button><p id="rMsg"></p></div></div>

<div id="tab2" style="display:none"><div id="docList"></div><div class="card"><h3>📹 Live Video + Documentation</h3><select id="cDocSelect" onchange="setupVideo()"></select><div id="videoBox"><iframe id="jitsiFrame" style="width:100%;height:100%;border:0;border-radius:10px" allow="camera; microphone; fullscreen"></iframe></div><div style="display:flex;gap:5px;margin-top:5px"><button class="loc" style="flex:1;background:#22c55e" onclick="startVideo()">📹 Start</button><button class="loc" style="flex:1;background:#ef4444" onclick="stopVideo()">❌ End & Save History</button></div><textarea id="chatInput" placeholder="Doctor: Type prescription / notes here..."></textarea><div id="chatBox">Notes</div><button class="pay" style="background:#8b5cf6" onclick="sendChat()">💬 Add Note</button><button class="pay" style="background:#22c55e" onclick="payConsult()">💳 Pay & Join Video</button><div id="videoNotes" class="fee" style="color:#fff"></div></div><div class="card"><h3>👨‍⚕️ Doctor Join</h3><input id="dName" placeholder="Dr. Name"><select id="dSpec"><option>General</option><option>Pediatrician</option><option>Gynecologist</option><option>Psychologist</option></select><input id="dPhone" placeholder="WhatsApp 233.."><input id="dRate" type="number" placeholder="Rate 30"><select id="dAvail"><option value="online">🟢 Online - Video Ready</option><option value="offline">🔴 Offline</option></select><button class="pay" style="background:#8b5cf6" onclick="regDoc()">Register Doctor</button><p id="dMsg"></p></div></div>

<div id="tab3" style="display:none"><div class="card"><h3>🔐 Admin Approve</h3><div id="adminList"></div></div></div>

<div id="tab4" style="display:none">
<div class="card"><h3>📜 All History</h3><div style="display:flex;gap:5px"><button class="loc" style="flex:1" onclick="renderHistory('all')">All</button><button class="loc" style="flex:1;background:#14b8a6" onclick="renderHistory('book')">🏠 Bookings</button><button class="loc" style="flex:1;background:#8b5cf6" onclick="renderHistory('consult')">📹 Video</button><button class="loc" style="flex:1;background:#ef4444" onclick="if(confirm('Clear ALL history?')){localStorage.removeItem('webcare_history');historyLog=[];renderHistory('all')}">🗑️ Clear</button></div><input id="histSearch" placeholder="🔍 Search name, phone..." oninput="renderHistory('all')"><div id="historyView"></div></div>
<div class="card"><h3>📊 Summary</h3><div id="histSummary" class="fee" style="color:#fff"></div></div>
</div>

<script>
const PK="pk_live_baf2c021aeb947445f9d53ed0ee3fd3e47acaf18"; let filterOnline=false, currentVideoNotes=[];
let workers=JSON.parse(localStorage.getItem('webcare_w')||'[]'); if(!workers.length)workers=[{name:"Grace Mensah",role:"Nurse",location:"East Legon",phone:"233244123456",rate:150,exp:5,lang:"English, Twi",bio:"Licensed nurse",lat:5.635,lng:-0.16,status:"online",approved:true,cv:"",card:"",license:"",rating:4.8}];
let doctors=JSON.parse(localStorage.getItem('webcare_d')||'[]'); if(!doctors.length)doctors=[{name:"Dr. Kwame Osei",spec:"General Doctor",phone:"233244654321",rate:30,status:"online"}];
let bookings=JSON.parse(localStorage.getItem('webcare_b')||'[]'); let historyLog=JSON.parse(localStorage.getItem('webcare_history')||'[]'); let wLat,wLng,cLat,cLng;
function showTab(n){document.getElementById('tab1').style.display=n==1?'block':'none';document.getElementById('tab2').style.display=n==2?'block':'none';document.getElementById('tab3').style.display=n==3?'block':'none';document.getElementById('tab4').style.display=n==4?'block':'none';for(let i=1;i<=4;i++)document.getElementById('t'+i).className=n==i?'on':'off'; if(n==3)renderAdmin(); if(n==4)renderHistory('all');}
function getLoc(t){navigator.geolocation.getCurrentPosition(p=>{if(t=='c'){cLat=p.coords.latitude;cLng=p.coords.longitude;document.getElementById('cLocation').value=`GPS: ${cLat.toFixed(5)}, ${cLng.toFixed(5)}`;}else{wLat=p.coords.latitude;wLng=p.coords.longitude;document.getElementById('rLocation').value=`GPS: ${wLat.toFixed(5)}, ${wLng.toFixed(5)}`;}});}
function save(){localStorage.setItem('webcare_w',JSON.stringify(workers));localStorage.setItem('webcare_d',JSON.stringify(doctors));localStorage.setItem('webcare_b',JSON.stringify(bookings));localStorage.setItem('webcare_history',JSON.stringify(historyLog));}
function fileToBase64(input){return new Promise(res=>{if(!input.files[0])return res("");let r=new FileReader();r.onload=e=>res(e.target.result);r.readAsDataURL(input.files[0]);});}
function addHistory(type,data){historyLog.unshift({type:type,date:new Date().toLocaleString(),...data}); save(); }
function render(){let h="",o="<option value=''>Choose worker</option>";let list=filterOnline?workers.filter(w=>w.approved&&w.status=='online'):workers.filter(w=>w.approved);if(!list.length)h=`<div class="fee">No ${filterOnline?'online':''} workers</div>`;list.forEach(w=>{let realIdx=workers.indexOf(w);let dot=w.status=='online'?'<span class="onlineDot"></span> 🟢':'<span class="offlineDot"></span> 🔴';h+=`<div class="card" onclick="document.getElementById('wSelect').value=${realIdx};viewProfile()" style="cursor:pointer;border-left:4px solid ${w.status=='online'?'#22c55e':'#475569'}"><b>${w.name}</b> <span class="badge">✓</span> ${dot}<br><small>${w.role} - 📍 ${w.location}</small></div>`;o+=`<option value="${realIdx}">${w.name} ${w.status=='online'?'🟢':''}</option>`;});document.getElementById('list').innerHTML=h;document.getElementById('wSelect').innerHTML=o;let dh="",do2="<option value=''>Choose Doctor</option>";doctors.forEach((d,i)=>{let dot=d.status=='online'?'<span class="onlineDot"></span> Online':'<span class="offlineDot"></span> Offline';dh+=`<div class="card" style="border-left:4px solid #8b5cf6"><b>${d.name}</b> - ${d.spec}<br>${dot}</div>`;do2+=`<option value="${i}">${d.name} ${d.status=='online'?'🟢📹':''}</option>`;});document.getElementById('docList').innerHTML=dh;document.getElementById('cDocSelect').innerHTML=do2;}
function renderAdmin(){let h="";workers.forEach((w,i)=>{if(w.approved)return;h+=`<div class="card" style="border:1px solid #f59e0b"><b>${w.name}</b> - ${w.role} - Pending<br>${w.phone}<br>${w.cv?`<img style="width:100%;max-height:100px;object-fit:cover;border-radius:6px" src="${w.cv}">`:''}<div style="display:flex;gap:5px;margin-top:5px"><button class="pay" style="background:#22c55e" onclick="approve(${i})">✅ Approve</button><button class="pay" style="background:#ef4444" onclick="reject(${i})">❌ Reject</button></div></div>`;});document.getElementById('adminList').innerHTML=h||"No pending ✅";}
function approve(i){workers[i].approved=true; addHistory('approval',{msg:`Approved ${workers[i].name}`,worker:workers[i].name}); save();render();renderAdmin();}
function reject(i){workers.splice(i,1);save();render();renderAdmin();}
function viewProfile(){let idx=document.getElementById('wSelect').value;if(idx==="")return;let w=workers[idx];document.getElementById('rate').value=w.rate;wLat=w.lat;wLng=w.lng;calc();let dot=w.status=='online'?'<span class="onlineDot"></span> 🟢 ONLINE NOW':'<span class="offlineDot"></span> 🔴 Offline';let html=`<div style="background:#0f172a;border:2px solid #14b8a6;padding:10px;border-radius:10px;margin-top:6px"><b>${w.name}</b> <span class="badge">✓ Approved</span><br>${dot}<br><small>${w.bio||''} - ${w.lang}</small><br><a class="nav" href="https://wa.me/${w.phone}" target="_blank">💬 Chat</a></div>`;document.getElementById('profileView').innerHTML=html;}
function calc(){let r=parseInt(document.getElementById('rate').value)||0,d=parseInt(document.getElementById('days').value)||0;if(!r||!d)return null;let tot=d*r;document.getElementById('calc').innerHTML=`Total GHS ${tot}`;return{tot};}
document.getElementById('days').addEventListener('input',calc);
async function reg(){let n=document.getElementById('rName').value,role=document.getElementById('rRole').value,loc=document.getElementById('rLocation').value,ph=document.getElementById('rPhone').value,rt=parseInt(document.getElementById('rRate').value),exp=document.getElementById('rExp').value,lang=document.getElementById('rLang').value,bio=document.getElementById('rBio').value,status=document.getElementById('rStatus').value;if(!n||!role||!ph||!rt)return alert("Fill all");let cv=await fileToBase64(document.getElementById('rCV')),card=await fileToBase64(document.getElementById('rCard')),lic=await fileToBase64(document.getElementById('rLicense'));workers.push({name:n,role:role,location:loc,phone:ph,rate:rt,exp:exp,lang:lang,bio:bio,lat:wLat,lng:wLng,status:status,approved:false,cv:cv,card:card,license:lic,rating:4.8});addHistory('registration',{msg:`New worker ${n} pending approval`,worker:n,phone:ph});save();render();document.getElementById('rMsg').innerText="✅ Submitted - Check Admin tab";}
function regDoc(){let n=document.getElementById('dName').value,s=document.getElementById('dSpec').value,p=document.getElementById('dPhone').value,r=parseInt(document.getElementById('dRate').value),st=document.getElementById('dAvail').value;if(!n||!s||!p||!r)return;doctors.push({name:n,spec:s,phone:p,rate:r,status:st});save();render();}
function payNow(){let d=calc(),cLoc=document.getElementById('cLocation').value,cPhone=document.getElementById('cPhone').value,idx=document.getElementById('wSelect').value;if(!d||!cLoc||!cPhone||idx==="")return alert("Select worker & fill");let w=workers[idx];let h=PaystackPop.setup({key:PK,email:document.getElementById('cEmail').value||"c@test.com",amount:d.tot*100,currency:"GHS",ref:"WEBCARE_"+Date.now(),callback:function(res){bookings.push({workerName:w.name,clientLoc:cLoc,clientPhone:cPhone,cLat:cLat,cLng:cLng}); addHistory('booking',{msg:`Booked ${w.name} for ${document.getElementById('days').value} days - GHS ${d.tot}`,worker:w.name,client:cPhone,amount:d.tot,ref:res.reference,location:cLoc}); save();render();document.getElementById('msg').innerText="✅ Paid! "+res.reference; renderHistory('all');},onClose:function(){}});h.openIframe();}
function setupVideo(){let di=document.getElementById('cDocSelect').value;if(di==="")return;let doc=doctors[di];let room="WEBCARE_"+doc.phone+"_"+Date.now();document.getElementById('jitsiFrame').src=`https://meet.jit.si/${room}#config.prejoinPageEnabled=false`;document.getElementById('videoNotes').innerText=`Room: https://meet.jit.si/${room}`;}
function startVideo(){let di=document.getElementById('cDocSelect').value;if(di==="")return alert("Choose doctor");let doc=doctors[di];let room="WEBCARE_"+doc.phone;document.getElementById('jitsiFrame').src=`https://meet.jit.si/${room}#config.prejoinPageEnabled=false`;currentVideoNotes=[];document.getElementById('videoNotes').innerHTML=`🔴 LIVE: https://meet.jit.si/${room}`;}
function stopVideo(){let notes=currentVideoNotes.join(' | ')||document.getElementById('chatBox').innerText; let di=document.getElementById('cDocSelect').value; let doc=di!==""?doctors[di].name:"Unknown"; addHistory('consult',{msg:`Video with ${doc} - Notes: ${notes.substring(0,100)}`,doctor:doc,notes:notes,room:document.getElementById('jitsiFrame').src}); document.getElementById('jitsiFrame').src=""; document.getElementById('videoNotes').innerText="✅ Video ended & saved to History"; currentVideoNotes=[]; renderHistory('all');}
function sendChat(){let t=document.getElementById('chatInput').value;if(!t)return;document.getElementById('chatBox').innerHTML+=`<div><b>${new Date().toLocaleTimeString()}:</b> ${t}</div>`;currentVideoNotes.push(t);document.getElementById('chatInput').value="";document.getElementById('videoNotes').innerHTML+=`<div>📝 ${t}</div>`;}
function payConsult(){let di=document.getElementById('cDocSelect').value;if(di==="")return alert("Choose doctor");let doc=doctors[di];let h=PaystackPop.setup({key:PK,email:"c@test.com",amount:doc.rate*100,currency:"GHS",ref:"CONSULT_"+Date.now(),callback:function(res){ addHistory('payment',{msg:`Paid GHS ${doc.rate} to ${doc.name} - ${res.reference}`,doctor:doc.name,amount:doc.rate,ref:res.reference}); window.open(`https://wa.me/${doc.phone}?text=Paid%20${res.reference}%20Video:%20https://meet.jit.si/WEBCARE_${doc.phone}`,"_blank"); startVideo(); save(); renderHistory('all');},onClose:function(){}});h.openIframe();}
function renderHistory(filter){let s=document.getElementById('histSearch').value.toLowerCase(); let filtered=historyLog.filter(h=>{let match=true; if(filter=='book')match=h.type=='booking'; if(filter=='consult')match=h.type=='consult' || h.type=='payment'; if(s)match=match && JSON.stringify(h).toLowerCase().includes(s); return match;}); let html=""; filtered.forEach(h=>{let icon=h.type=='booking'?'🏠':h.type=='consult'?'📹':h.type=='payment'?'💳':h.type=='approval'?'✅':'📝';let color=h.type=='booking'?'#14b8a6':h.type=='consult'?'#8b5cf6':h.type=='payment'?'#22c55e':'#94a3b8';html+=`<div class="histItem" style="border-left:3px solid ${color}"><div style="display:flex;justify-content:space-between"><b>${icon} ${h.type.toUpperCase()}</b><small>${h.date}</small></div><div style="margin-top:4px">${h.msg||''}</div>${h.notes?`<div style="margin-top:4px;color:#cbd5e1"><b>Notes:</b> ${h.notes}</div>`:''}${h.ref?`<small>Ref: ${h.ref}</small>`:''}</div>`;});document.getElementById('historyView').innerHTML=html||"<div class='fee'>No history yet. Book or do video - it will appear here.</div>"; let totalBookings=historyLog.filter(h=>h.type=='booking').length; let totalConsult=historyLog.filter(h=>h.type=='consult').length; let totalPaid=historyLog.filter(h=>h.type=='payment'||h.type=='booking').reduce((sum,h)=>sum+(h.amount||0),0); document.getElementById('histSummary').innerHTML=`Total Bookings: ${totalBookings}<br>Total Video Consults: ${totalConsult}<br>Total Revenue: GHS ${totalPaid}<br>Total Records: ${historyLog.length}`;}
render(); renderHistory('all');
</script></body></html>
