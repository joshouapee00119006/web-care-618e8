<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CARE233</title><script src="https://js.paystack.co/v1/inline.js"></script><style>*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#020617;color:#fff;padding:8px}.hdr{background:linear-gradient(135deg,#ce1126,#fcd116,#006b3f);padding:12px;border-radius:14px;text-align:center}.loginRow{display:flex;gap:4px;margin-top:6px}.loginBtn{flex:1;padding:6px;border-radius:20px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:10px;font-weight:700}.card{background:#1e293b;padding:10px;border-radius:10px;margin-top:8px;border:1px solid #334155}.tab{display:flex;gap:3px;margin-top:6px}.tab button{flex:1;padding:9px;border-radius:8px;border:0;font-weight:800;font-size:12px}.on{background:#ce1126;color:#fff}.off{background:#334155;color:#aaa}.pay{background:#006b3f;color:#fff;width:100%;padding:9px;border:0;border-radius:8px;font-weight:800;margin-top:5px}.sos{background:#ef4444;color:#fff;width:100%;padding:14px;border:0;border-radius:12px;font-weight:900;margin-top:8px}.loc{background:#3b82f6;color:#fff;padding:7px;border:0;border-radius:6px;font-size:10px}.badge{background:#22c55e;padding:2px 6px;border-radius:20px;font-size:8px}input,select,textarea{width:100%;padding:7px;margin-top:4px;border:1px solid #475569;border-radius:7px;background:#0f172a;color:#fff;font-size:11px}.fee{font-size:10px;background:#0f172a;padding:5px;border-radius:5px;margin-top:4px;color:#94a3b8}.policeCard{background:#7f1d1d;border:2px solid #ef4444;padding:8px;border-radius:8px;margin-top:5px}.clientBtn{display:block;width:100%;text-align:left;padding:8px;margin-top:3px;border-radius:6px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:11px}.clientBtn.active{background:#ce1126}</style></head><body>
<div class="hdr" id="secretLogo"><h1 style="margin:0;font-size:20px">CARE233 🇬🇭</h1><small>Professional Homecare</small><div class="loginRow"><button class="loginBtn" onclick="openStaffLogin()">👥 Staff Login</button><button class="loginBtn" onclick="openWorkerLogin()">👩‍⚕️ Worker Login</button><button class="loginBtn" id="logoutBtn" style="display:none;background:#ef4444" onclick="logout()">Logout</button></div><small id="whoIs" style="font-size:9px;color:#fcd116"></small></div>
<div class="tab"><button id="t1" class="on" onclick="showTab(1)">Book</button><button id="t2" class="off" onclick="showTab(2)">Video</button><button id="t5" class="off" onclick="showTab(5)">SOS</button><button id="t4" class="off" onclick="showTab(4)">History</button></div>

<div id="tab1"><div style="display:flex;gap:4px;margin-top:6px"><select id="regionFilter" onchange="render()" style="flex:1"><option value="">All Regions</option><option>Greater Accra</option><option>Ashanti</option><option>Western</option><option>Central</option><option>Eastern</option><option>Volta</option><option>Northern</option><option>Upper East</option><option>Upper West</option><option>North East</option><option>Savannah</option><option>Bono</option><option>Bono East</option><option>Ahafo</option><option>Oti</option></select><button class="loc" onclick="filterOnline=!filterOnline;render()" style="flex:0.6">🟢 Online</button></div><div id="list"></div>
<div class="card"><h3>Book Care</h3><select id="wSelect" onchange="viewProfile()"></select><div id="profileView"></div><div style="display:flex;gap:4px"><input id="cLocation" placeholder="Location" style="flex:1"><button class="loc" onclick="getLoc('c')">📍</button></div><input id="days" type="number" placeholder="Days"><input id="rate" type="number" placeholder="Rate"><input id="cEmail" placeholder="Email"><input id="cPhone" placeholder="Phone 233.."><div id="calc" class="fee"></div><button class="pay" onclick="payNow()">Pay</button><p id="msg"></p></div>
<div class="card"><h3>Join as Worker</h3><select id="rRegion"><option value="">Region</option><option>Greater Accra</option><option>Ashanti</option><option>Western</option><option>Central</option><option>Eastern</option><option>Volta</option><option>Northern</option><option>Upper East</option><option>Upper West</option><option>North East</option><option>Savannah</option><option>Bono</option><option>Bono East</option><option>Ahafo</option><option>Oti</option></select><input id="rDistrict" placeholder="District"><input id="rName" placeholder="Full Name"><select id="rRole"><option value="">Role</option><option>Nurse</option><option>Caregiver</option><option>Midwife</option><option>Doctor</option></select><div style="display:flex;gap:4px"><input id="rLocation" placeholder="Town" style="flex:1"><button class="loc" onclick="getLoc('w')">📍</button></div><input id="rPhone" placeholder="WhatsApp 233.."><input id="rPass" type="password" placeholder="Create Worker Password *"><input id="rExp" type="number" placeholder="Years"><input id="rLang" placeholder="Languages"><textarea id="rBio" placeholder="About you"></textarea><input id="rRate" type="number" placeholder="Rate/day GHS"><select id="rStatus"><option value="online">Online</option><option value="offline">Offline</option></select><button class="pay" onclick="reg()">Submit Registration</button><p id="rMsg"></p></div></div>

<div id="tab2" style="display:none"><div id="docList"></div><div class="card"><h3>Video</h3><select id="cDocSelect"></select><div style="width:100%;height:200px;background:#000;border-radius:8px"><iframe id="jitsiFrame" style="width:100%;height:100%;border:0" allow="camera; microphone"></iframe></div><div style="display:flex;gap:4px;margin-top:4px"><button class="loc" style="flex:1;background:#22c55e" onclick="startVideo()">Start</button><button class="loc" style="flex:1;background:#ef4444" onclick="stopVideo()">End</button></div><textarea id="chatInput" placeholder="Note..."></textarea><div id="chatBox" style="height:70px;overflow-y:auto;background:#020617;padding:5px;border-radius:6px;font-size:10px"></div><button class="pay" style="background:#8b5cf6" onclick="sendChat()">Add</button><button class="pay" style="background:#ce1126" onclick="payConsult()">Pay</button></div></div>

<div id="tab5" style="display:none"><div class="card" style="border:3px solid #ef4444"><h3>Worker SOS</h3><input id="sosPhone" placeholder="Your Phone"><input id="sosName" placeholder="Your Name"><div style="display:flex;gap:4px"><input id="sosLoc" placeholder="Location" style="flex:1"><button class="loc" onclick="getLoc('sos')">📍</button></div><select id="sosRegion"><option>Greater Accra</option><option>Ashanti</option><option>Western</option><option>Central</option><option>Eastern</option><option>Volta</option><option>Northern</option><option>Upper East</option><option>Upper West</option><option>North East</option><option>Savannah</option><option>Bono</option><option>Bono East</option><option>Ahafo</option><option>Oti</option></select><textarea id="sosDesc" placeholder="Danger..."></textarea><button class="sos" onclick="triggerSOS()">SEND SOS</button><p id="sosMsg"></p></div><div id="sosHistory"></div></div>

<div id="tab3" style="display:none"><div class="card" style="border:2px solid #fcd116"><h3>Admin Panel <span id="adminRoleTitle"></span></h3><div style="display:flex;gap:4px;flex-wrap:wrap"><button class="loc" onclick="showTab(1)" style="flex:1">Hide</button><button id="btnSettings" class="loc" style="flex:1;background:#f59e0b;display:none" onclick="showSection('settings')">Settings</button><button id="btnStaff" class="loc" style="flex:1;background:#8b5cf6;display:none" onclick="showSection('staff')">Staff</button><button class="loc" style="flex:1;background:#ef4444" onclick="showSection('sosAlerts')">SOS</button><button class="loc" style="flex:1;background:#22c55e" onclick="showSection('chat')">Chat</button></div>
<div id="sec-settings" style="display:none"><div class="card"><h4>Change Admin Password - Admin Only</h4><input id="oldPass" type="password" placeholder="Old"><input id="newPass" type="password" placeholder="New"><input id="confirmPass" type="password" placeholder="Confirm"><button class="pay" onclick="changeAdminPass()">Update</button><p id="passMsg"></p></div></div>
<div id="sec-staff" style="display:none"><div class="card"><h4>Staff Manager - Admin Only</h4><input id="staffName" placeholder="Name"><select id="staffRole"><option value="manager">Manager - Approve + Chat</option><option value="support">Support - Chat Only</option></select><input id="staffUser" placeholder="Username"><input id="staffPass" type="text" placeholder="Password for staff"><button class="pay" style="background:#8b5cf6" onclick="addStaff()">Add Staff</button><div id="staffList"></div></div></div>
<div id="sec-sosAlerts"><h4>SOS Alerts</h4><div id="sosAlerts"></div><h4>Pending Workers</h4><div id="adminList"></div></div>
<div id="sec-chat" style="display:none"><div class="card"><h4>Chat - Select Client</h4><small id="chatTarget" style="color:#fcd116">Target: ALL</small><div style="display:flex;gap:6px;margin-top:6px"><div style="flex:0.9;background:#020617;border-radius:6px;padding:4px;max-height:180px;overflow-y:auto"><b style="font-size:9px">CLIENTS</b><div id="clientList"></div></div><div style="flex:1.2"><div id="chatCenter" style="height:150px;overflow-y:auto;background:#020617;padding:5px;border-radius:6px;font-size:10px;border:1px solid #334155"></div><input id="adminChat" placeholder="Message..."><div style="display:flex;gap:3px"><button class="pay" style="flex:1;background:#3b82f6" onclick="adminChatSend()">Send Selected</button><button class="pay" style="flex:1;background:#22c55e" onclick="broadcastAll()">Broadcast All</button></div></div></div></div></div>
</div></div>

<div id="tab6" style="display:none"><div class="card" style="border:2px solid #22c55e"><h3>Worker Dashboard <span id="workerNameTag"></span></h3><div style="display:flex;gap:4px"><button class="loc" style="flex:1;background:#22c55e" onclick="toggleOnline('online')">🟢 Go Online</button><button class="loc" style="flex:1;background:#475569" onclick="toggleOnline('offline')">🔴 Offline</button></div><p id="workerInfo"></p><h4>My Bookings</h4><div id="workerBookings"></div><h4>My SOS</h4><div id="workerSOS"></div></div></div>

<div id="tab4" style="display:none"><div class="card"><h3>History</h3><input id="histSearch" placeholder="Search..." oninput="renderHistory()"><div id="historyView"></div><div id="clientInbox"></div><div style="margin-top:6px"><input id="clientReply" placeholder="Reply to staff..."><button class="pay" style="background:#3b82f6" onclick="clientReplySend()">Reply</button></div></div></div>

<script>
const PK="pk_live_baf2c021aeb947445f9d53ed0ee3fd3e47acaf18";
let ADMIN_PASSWORD=localStorage.getItem('care233_admin_pass')||"1234";
let adminClicks=0,lastClick=0,filterOnline=false,wLat,wLng,cLat,cLng,sosLat,sosLng;
let CURRENT_ROLE=localStorage.getItem('care233_current_role')||'public'; let CURRENT_USER='', SELECTED_CLIENT='ALL', LOGGED_WORKER=null;
let workers=JSON.parse(localStorage.getItem('webcare_w')||'[]'); if(!workers.length)workers=[{name:"Grace Mensah",role:"Nurse",region:"Greater Accra",phone:"233244123456",rate:150,status:"online",approved:true,pass:"1234"}];
let staffs=JSON.parse(localStorage.getItem('care233_staff')||'[]');
let historyLog=JSON.parse(localStorage.getItem('webcare_history')||'[]');
let sosLog=JSON.parse(localStorage.getItem('care233_sos')||'[]');
let chats=JSON.parse(localStorage.getItem('care233_chats')||'[]');
let clients=JSON.parse(localStorage.getItem('care233_clients')||'[]');
const POLICE=[{region:"Greater Accra",name:"East Legon Police",phone:"0302542610",lat:5.635,lng:-0.152},{region:"Ashanti",name:"Kumasi Central",phone:"0322023361",lat:6.688,lng:-1.624},{region:"Western",name:"Takoradi Central",phone:"0312022290",lat:4.901,lng:-1.783},{region:"Central",name:"Cape Coast Police",phone:"0332132348",lat:5.105,lng:-1.246},{region:"Eastern",name:"Koforidua Police",phone:"0342022340",lat:6.094,lng:-0.259},{region:"Volta",name:"Ho Police",phone:"0362022822",lat:6.611,lng:0.470},{region:"Northern",name:"Tamale Central",phone:"0372022300",lat:9.4,lng:-0.839},{region:"Upper East",name:"Bolgatanga Police",phone:"0382022340",lat:10.785,lng:-0.851},{region:"Upper West",name:"Wa Police",phone:"0392022320",lat:10.06,lng:-2.501},{region:"Bono",name:"Sunyani Police",phone:"0352022733",lat:7.336,lng:-2.327}];
function getDistance(a,b,c,d){let R=6371,la=(c-a)*Math.PI/180,lo=(d-b)*Math.PI/180;return R*2*Math.asin(Math.sqrt(Math.sin(la/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(lo/2)**2));}
function save(){localStorage.setItem('webcare_w',JSON.stringify(workers));localStorage.setItem('webcare_history',JSON.stringify(historyLog));localStorage.setItem('care233_staff',JSON.stringify(staffs));localStorage.setItem('care233_sos',JSON.stringify(sosLog));localStorage.setItem('care233_chats',JSON.stringify(chats));localStorage.setItem('care233_clients',JSON.stringify(clients));}
function logout(){CURRENT_ROLE='public';CURRENT_USER='';LOGGED_WORKER=null;localStorage.setItem('care233_current_role','public');document.getElementById('whoIs').innerText='';document.getElementById('logoutBtn').style.display='none';showTab(1);render();}
function openStaffLogin(){let u=prompt("Staff Username:"); if(!u)return; let p=prompt("Staff Password (given by Admin):"); if(!p)return; if(p===ADMIN_PASSWORD){alert("Admin must use 5x tap, not staff login");return;} let st=staffs.find(x=>x.user===u && x.pass===p); if(!st){alert("Wrong staff login");return;} CURRENT_ROLE=st.role; CURRENT_USER=st.name; localStorage.setItem('care233_current_role',st.role); document.getElementById('whoIs').innerText='STAFF: '+st.name+' ('+st.role+')'; document.getElementById('logoutBtn').style.display='block'; showAdminPanelForStaff();}
function openWorkerLogin(){let ph=prompt("Worker Phone 233..:"); if(!ph)return; let pw=prompt("Worker Password:"); if(!pw)return; let w=workers.find(x=>x.phone===ph && x.pass===pw); if(!w){alert("Wrong worker login or not approved yet");return;} LOGGED_WORKER=w; CURRENT_ROLE='worker'; CURRENT_USER=w.name; document.getElementById('whoIs').innerText='WORKER: '+w.name; document.getElementById('logoutBtn').style.display='block'; showWorkerDash();}
function showWorkerDash(){document.getElementById('tab1').style.display='none';document.getElementById('tab2').style.display='none';document.getElementById('tab3').style.display='none';document.getElementById('tab4').style.display='none';document.getElementById('tab5').style.display='none';document.getElementById('tab6').style.display='block'; for(let i=1;i<=5;i++){let b=document.getElementById('t'+i);if(b)b.className='off';} document.getElementById('workerNameTag').innerText='- '+LOGGED_WORKER.name; document.getElementById('workerInfo').innerHTML=`Role: ${LOGGED_WORKER.role}<br>Region: ${LOGGED_WORKER.region}<br>Status: ${LOGGED_WORKER.status} ${LOGGED_WORKER.approved?'✅ Approved':'⏳ Pending'}<br>Rate: GHS ${LOGGED_WORKER.rate}`; renderWorkerBookings();}
function renderWorkerBookings(){let h=""; historyLog.filter(x=>x.worker===LOGGED_WORKER.name).forEach(x=>{h+=`<div class="fee" style="color:#fff">${x.date} - ${x.msg}</div>`;}); document.getElementById('workerBookings').innerHTML=h||"No bookings yet"; let s=""; sosLog.filter(x=>x.phone===LOGGED_WORKER.phone).forEach(x=>{s+=`<div class="policeCard">${x.date} - ${x.region} - ${x.desc}</div>`;}); document.getElementById('workerSOS').innerHTML=s||"No SOS";}
function toggleOnline(st){if(!LOGGED_WORKER)return; LOGGED_WORKER.status=st; let idx=workers.findIndex(x=>x.phone===LOGGED_WORKER.phone); if(idx>=0)workers[idx].status=st; save(); document.getElementById('workerInfo').innerHTML+=`<br>Now ${st}`; render();}
function showAdminPanelForStaff(){document.getElementById('tab1').style.display='none';document.getElementById('tab2').style.display='none';document.getElementById('tab3').style.display='block';document.getElementById('tab4').style.display='none';document.getElementById('tab5').style.display='none';document.getElementById('tab6').style.display='none'; for(let i=1;i<=5;i++){let b=document.getElementById('t'+i);if(b)b.className='off';} document.getElementById('adminRoleTitle').innerText='- '+CURRENT_ROLE.toUpperCase()+' '+CURRENT_USER; if(CURRENT_ROLE==='superadmin'){document.getElementById('btnSettings').style.display='block';document.getElementById('btnStaff').style.display='block';}else{document.getElementById('btnSettings').style.display='none';document.getElementById('btnStaff').style.display='none';} showSection('chat'); renderAdmin(); renderSOSAlerts(); renderClientList();}
function showSection(s){if((s=='settings'||s=='staff')&&CURRENT_ROLE!=='superadmin'){alert('Only Super Admin');return;}document.getElementById('sec-settings').style.display=s=='settings'?'block':'none';document.getElementById('sec-staff').style.display=s=='staff'?'block':'none';document.getElementById('sec-sosAlerts').style.display=s=='sosAlerts'?'block':'none';document.getElementById('sec-chat').style.display=s=='chat'?'block':'none';if(s=='chat')renderClientList();}
function showAdmin(){let p=prompt("Admin Password:"); if(!p)return; if(p!==ADMIN_PASSWORD){alert("Wrong admin");return;} CURRENT_ROLE='superadmin';CURRENT_USER='Admin';localStorage.setItem('care233_current_role','superadmin');document.getElementById('whoIs').innerText='ADMIN: Super Admin';document.getElementById('logoutBtn').style.display='block';showAdminPanelForStaff();}
function showTab(n){if(n==3){showAdmin();return;}document.getElementById('tab1').style.display=n==1?'block':'none';document.getElementById('tab2').style.display=n==2?'block':'none';document.getElementById('tab3').style.display=n==3?'block':'none';document.getElementById('tab4').style.display=n==4?'block':'none';document.getElementById('tab5').style.display=n==5?'block':'none';document.getElementById('tab6').style.display='none';for(let i=1;i<=5;i++){let b=document.getElementById('t'+i);if(b)b.className=n==i?'on':'off';} if(n==4)renderHistory(); if(n==5)renderSOSHistory();}
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('secretLogo').addEventListener('click',()=>{let now=Date.now();if(now-lastClick>2000)adminClicks=0;lastClick=now;adminClicks++;if(adminClicks>=5){adminClicks=0;showAdmin();}});let saved=localStorage.getItem('care233_current_role');if(saved&&saved!=='public'){document.getElementById('whoIs').innerText=saved.toUpperCase();document.getElementById('logoutBtn').style.display='block';}});
function getLoc(t){navigator.geolocation.getCurrentPosition(p=>{if(t=='c'){cLat=p.coords.latitude;cLng=p.coords.longitude;document.getElementById('cLocation').value=`${cLat.toFixed(5)}, ${cLng.toFixed(5)}`;}else if(t=='w'){wLat=p.coords.latitude;wLng=p.coords.longitude;document.getElementById('rLocation').value=`${wLat.toFixed(5)}, ${wLng.toFixed(5)}`;}else{sosLat=p.coords.latitude;sosLng=p.coords.longitude;document.getElementById('sosLoc').value=`${sosLat.toFixed(5)}, ${sosLng.toFixed(5)}`;}});}
function triggerSOS(){let phone=document.getElementById('sosPhone').value,name=document.getElementById('sosName').value,reg=document.getElementById('sosRegion').value,desc=document.getElementById('sosDesc').value,loc=document.getElementById('sosLoc').value; if(!phone||!name)return alert("Fill"); let lat=sosLat||5.6,lng=sosLng||-0.2; let nearest=POLICE.filter(p=>p.region===reg).map(p=>({...p,dist:getDistance(lat,lng,p.lat,p.lng)})).sort((a,b)=>a.dist-b.dist).slice(0,2); let entry={date:new Date().toLocaleString(),name,phone,region:reg,loc,lat,lng,desc,nearest,status:"NEW"}; sosLog.unshift(entry); historyLog.unshift({type:'sos',date:entry.date,msg:`SOS ${name} ${reg}`}); save(); document.getElementById('sosMsg').innerHTML=`SOS SENT! ${nearest.map(n=>`${n.name} ${n.phone}`).join(', ')}`; renderSOSAlerts();}
function renderSOSAlerts(){let h=""; sosLog.forEach(s=>{h+=`<div class="policeCard"><b>${s.name} - ${s.region}</b><br>${s.phone} - ${s.loc}<br>${s.desc}<br>${s.nearest.map(n=>`<a href="tel:${n.phone}" style="color:#fcd116">${n.name} ${n.phone}</a>`).join('<br>')}</div>`;}); document.getElementById('sosAlerts').innerHTML=h||"No SOS"; document.getElementById('sosHistory').innerHTML=h||"";}
function renderSOSHistory(){renderSOSAlerts();}
function changeAdminPass(){if(CURRENT_ROLE!=='superadmin')return alert('Only Admin'); let o=document.getElementById('oldPass').value,n=document.getElementById('newPass').value,c=document.getElementById('confirmPass').value; if(o!==ADMIN_PASSWORD||n!==c)return alert('Wrong'); ADMIN_PASSWORD=n; localStorage.setItem('care233_admin_pass',n); document.getElementById('passMsg').innerText="Updated";}
function addStaff(){if(CURRENT_ROLE!=='superadmin')return alert('Only Admin'); let n=document.getElementById('staffName').value,r=document.getElementById('staffRole').value,u=document.getElementById('staffUser').value,p=document.getElementById('staffPass').value; if(!n||!u||!p)return alert("Fill"); staffs.push({name:n,role:r,user:u,pass:p}); save(); renderStaff();}
function renderStaff(){let h=""; staffs.forEach((s,i)=>{h+=`<div class="fee" style="color:#fff">👤 ${s.name} - ${s.role} - ${s.user}/${s.pass} ${CURRENT_ROLE==='superadmin'?`<button onclick="staffs.splice(${i},1);save();renderStaff()" style="background:#ef4444;color:#fff;border:0;border-radius:4px">Del</button>`:''}</div>`;}); document.getElementById('staffList').innerHTML=h;}
function renderClientList(){let list=[...new Set(clients)]; let h=`<button class="clientBtn ${SELECTED_CLIENT==='ALL'?'active':''}" onclick="selectClient('ALL')">📢 ALL (${list.length})</button>`; list.forEach(c=>{h+=`<button class="clientBtn ${SELECTED_CLIENT===c?'active':''}" onclick="selectClient('${c}')">👤 ${c}</button>`;}); document.getElementById('clientList').innerHTML=h; renderChatThread();}
function selectClient(phone){SELECTED_CLIENT=phone; document.getElementById('chatTarget').innerText='Target: '+(phone==='ALL'?'ALL':phone); renderClientList();}
function renderChatThread(){let filtered=SELECTED_CLIENT==='ALL'?chats:chats.filter(c=>c.target===SELECTED_CLIENT||c.fromPhone===SELECTED_CLIENT); let h=""; filtered.forEach(c=>{h+=`<div><b>${c.from}:</b> ${c.msg}</div>`;}); document.getElementById('chatCenter').innerHTML=h||"No msgs";}
function adminChatSend(){let t=document.getElementById('adminChat').value; if(!t)return; chats.unshift({date:new Date().toLocaleString(),from:CURRENT_USER+'('+CURRENT_ROLE+')',target:SELECTED_CLIENT,msg:t}); save(); document.getElementById('adminChat').value=""; renderChatThread(); renderHistory();}
function broadcastAll(){let t=document.getElementById('adminChat').value; if(!t)return; chats.unshift({date:new Date().toLocaleString(),from:CURRENT_USER+'('+CURRENT_ROLE+')',target:'ALL',msg:t}); save(); document.getElementById('adminChat').value=""; SELECTED_CLIENT='ALL'; renderClientList();}
function render(){let rf=document.getElementById('regionFilter').value;let h="",o="<option value=''>Choose worker</option>";let list=workers.filter(w=>w.approved); if(rf)list=list.filter(w=>w.region===rf); if(filterOnline)list=list.filter(w=>w.status==='online'); list.forEach(w=>{let idx=workers.indexOf(w);h+=`<div class="card" onclick="document.getElementById('wSelect').value=${idx};viewProfile()"><b>${w.name}</b> <span class="badge">${w.region}</span> ${w.status==='online'?'🟢':''}<br><small>${w.role} - ${w.location||''}</small></div>`;o+=`<option value="${idx}">${w.name} ${w.status==='online'?'🟢':''}</option>`;});document.getElementById('list').innerHTML=h;document.getElementById('wSelect').innerHTML=o;let do2="<option value=''>Choose Doctor</option>";let doctors=JSON.parse(localStorage.getItem('webcare_d')||'[]');doctors.forEach((d,i)=>{do2+=`<option value="${i}">${d.name}</option>`;});document.getElementById('cDocSelect').innerHTML=do2;}
function renderAdmin(){let h="";workers.forEach((w,i)=>{if(w.approved)return; let can=CURRENT_ROLE==='superadmin'||CURRENT_ROLE==='manager'; h+=`<div class="card"><b>${w.name}</b> - ${w.region} - ${w.phone}<br>${can?`<button class="pay" style="background:#22c55e" onclick="workers[${i}].approved=true;save();render();renderAdmin()">Approve</button><button class="pay" style="background:#ef4444" onclick="workers.splice(${i},1);save();render();renderAdmin()">Reject</button>`:''}</div>`;});document.getElementById('adminList').innerHTML=h||"No pending";}
function viewProfile(){let idx=document.getElementById('wSelect').value;if(idx==="")return;let w=workers[idx];document.getElementById('rate').value=w.rate;calc();document.getElementById('profileView').innerHTML=`<b>${w.name}</b> - ${w.region}`;}
function calc(){let r=parseInt(document.getElementById('rate').value)||0,d=parseInt(document.getElementById('days').value)||0;if(!r||!d)return null;let tot=d*r;document.getElementById('calc').innerHTML=`Total GHS ${tot}`;return{tot};}
document.getElementById('days').addEventListener('input',calc);
function reg(){let n=document.getElementById('rName').value,role=document.getElementById('rRole').value,regn=document.getElementById('rRegion').value,ph=document.getElementById('rPhone').value,rt=parseInt(document.getElementById('rRate').value),pw=document.getElementById('rPass').value;if(!n||!role||!regn||!ph||!rt||!pw)return alert("Fill all incl password");workers.push({name:n,role,region:regn,district:document.getElementById('rDistrict').value,location:document.getElementById('rLocation').value,phone:ph,pass:pw,rate:rt,status:document.getElementById('rStatus').value,approved:false});save();render();document.getElementById('rMsg').innerText="Submitted - Use phone "+ph+" + password to login as worker";}
function payNow(){let d=calc(),cPhone=document.getElementById('cPhone').value,idx=document.getElementById('wSelect').value;if(!d||!cPhone||idx==="")return alert("Fill");let w=workers[idx]; if(!clients.includes(cPhone))clients.push(cPhone); localStorage.setItem('care233_my_phone',cPhone); let h=PaystackPop.setup({key:PK,email:document.getElementById('cEmail').value||"c@test.com",amount:d.tot*100,currency:"GHS",ref:"CARE233_"+Date.now(),callback:function(res){historyLog.unshift({type:'booking',date:new Date().toLocaleString(),msg:`Booked ${w.name} GHS ${d.tot}`,worker:w.name,client:cPhone}); save();document.getElementById('msg').innerText="Paid! "+res.reference; renderHistory(); renderClientList();},onClose:function(){}});h.openIframe();}
function startVideo(){let di=document.getElementById('cDocSelect').value;if(di==="")return alert("Choose");let doctors=JSON.parse(localStorage.getItem('webcare_d')||'[]');let doc=doctors[di];document.getElementById('jitsiFrame').src=`https://meet.jit.si/CARE233_${doc.phone}`;}
function stopVideo(){document.getElementById('jitsiFrame').src="";}
function sendChat(){let t=document.getElementById('chatInput').value;if(!t)return;document.getElementById('chatBox').innerHTML+=`<div>${t}</div>`;document.getElementById('chatInput').value="";}
function payConsult(){let di=document.getElementById('cDocSelect').value;if(di==="")return;let doctors=JSON.parse(localStorage.getItem('webcare_d')||'[]');let doc=doctors[di];let h=PaystackPop.setup({key:PK,email:"c@test.com",amount:doc.rate*100,currency:"GHS",ref:"CARE233_"+Date.now(),callback:function(res){startVideo();},onClose:function(){}});h.openIframe();}
function renderHistory(){let s=document.getElementById('histSearch')?document.getElementById('histSearch').value.toLowerCase():''; let filtered=historyLog.filter(h=>!s||JSON.stringify(h).toLowerCase().includes(s)); let html=""; filtered.forEach(h=>{html+=`<div class="fee" style="color:#fff">${h.type} ${h.date} ${h.msg}</div>`;});document.getElementById('historyView').innerHTML=html; let cur=localStorage.getItem('care233_my_phone')||""; let inbox=""; chats.filter(c=>c.target===cur||c.target==='ALL').forEach(c=>{inbox+=`<div class="fee" style="color:#fff;border-left:3px solid #22c55e"><b>${c.from}:</b> ${c.msg}</div>`;}); document.getElementById('clientInbox').innerHTML=inbox?`<h4>My Messages</h4>${inbox}`:"";}
function clientReplySend(){let t=document.getElementById('clientReply').value; if(!t)return; let myPhone=localStorage.getItem('care233_my_phone')||"Client"; chats.unshift({date:new Date().toLocaleString(),from:myPhone,fromPhone:myPhone,target:'STAFF',msg:t}); save(); document.getElementById('clientReply').value=""; renderHistory(); renderClientList();}
render(); renderHistory();
</script></body></html>
