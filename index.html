<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CARE233 - Home Nursing Ghana | Earn 3% Referral</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f5f5f5}
.header{background:#0A4D2E;color:#FFD700;padding:15px;text-align:center;position:sticky;top:0;z-index:99}
.logo{font-size:28px;font-weight:bold}
.banner-ref{background:#FFD700;color:#0A4D2E;padding:10px;text-align:center;font-weight:bold;display:none}
.container{max-width:500px;margin:20px auto;background:white;padding:20px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
h2{color:#0A4D2E;text-align:center;margin-bottom:15px}
label{font-weight:bold;color:#0A4D2E;display:block;margin-top:12px}
input,select,textarea{width:100%;padding:12px;margin-top:5px;border:1px solid #ccc;border-radius:8px;font-size:16px}
.btn{background:#0A4D2E;color:#FFD700;padding:14px;width:100%;border:none;border-radius:8px;font-size:18px;font-weight:bold;margin-top:15px;cursor:pointer}
.btn-earn{background:#FFD700;color:#0A4D2E;padding:12px;text-align:center;border-radius:8px;display:block;text-decoration:none;font-weight:bold;margin-bottom:15px;border:2px solid #0A4D2E}
.msg{padding:8px;border-radius:5px;margin-top:5px;font-size:14px}
.success{background:#d4edda;color:#155724}
</style>
</head>
<body>
<div class="header">
<div class="logo">🏠 CARE233</div>
<div>Home Nursing • Ghana - Earn 3% Per Referral</div>
</div>
<div id="refBanner" class="banner-ref"></div>
<div class="container">
<a href="refer.html" class="btn-earn">💰 EVERYONE CAN EARN 3% - Get Your Link</a>
<h2>Book a Nurse Now</h2>
<label>Your Name *</label>
<input id="clientName" placeholder="e.g. Ama Mensah">
<label>Your Phone *</label>
<input id="clientPhone" placeholder="e.g. 0544121814">
<div id="phoneMsg"></div>
<label>Region *</label>
<select id="region"><option value="">Select Region</option><option>Greater Accra</option><option>Ashanti</option><option>Western</option><option>Eastern</option><option>Central</option><option>Volta</option><option>Northern</option><option>Others</option></select>
<label>Service Needed *</label>
<select id="service"><option value="">Select Service</option><option>Elderly Care - GHC 500</option><option>Baby Care - GHC 400</option><option>Wound Dressing - GHC 300</option><option>Post-Surgery Care - GHC 600</option><option>Injection Service - GHC 200</option><option>Full Time Nurse - GHC 2500</option></select>
<label>Care Type</label>
<select id="careType"><option>Day</option><option>Night</option><option>Live-in</option><option>Part-time</option></select>
<label>Referral Code</label>
<input id="refCode" placeholder="e.g. KOFI1814 or leave blank">
<div id="refMsg"></div>
<label>Notes</label>
<textarea id="notes" placeholder="Describe what you need..."></textarea>
<button class="btn" onclick="bookNow()">Book Nurse via WhatsApp</button>
<p style="font-size:13px;text-align:center;margin-top:15px">When you book with referral code, your friend earns 3% via MoMo!<br>Everyone can refer - <a href="refer.html">Get your link here</a></p>
</div>
<script>
const urlParams = new URLSearchParams(window.location.search);
const urlRef = urlParams.get('ref');
if(urlRef){localStorage.setItem('care233_ref', urlRef.toUpperCase());}
window.addEventListener('load', ()=>{
  let savedRef = localStorage.getItem('care233_ref');
  if(savedRef || urlRef){
    let code = (urlRef || savedRef).toUpperCase();
    document.getElementById('refCode').value = code;
    document.getElementById('refCode').disabled = true;
    document.getElementById('refMsg').innerHTML = "✅ Referred by: <b>"+code+"</b> - You get 5% discount, they earn 3%!";
    document.getElementById('refBanner').style.display = "block";
    document.getElementById('refBanner').innerHTML = "🎉 Referred by "+code+" - Discount! | <a href='refer.html' style='color:#0A4D2E'>Earn 3% too?</a>";
  }
});
function bookNow(){
  let name = document.getElementById('clientName').value.trim();
  let phone = document.getElementById('clientPhone').value.trim();
  let region = document.getElementById('region').value;
  let service = document.getElementById('service').value;
  let careType = document.getElementById('careType').value;
  let refCode = document.getElementById('refCode').value.trim().toUpperCase() || localStorage.getItem('care233_ref') || 'Direct';
  let notes = document.getElementById('notes').value.trim();
  if(!name ||!phone ||!region ||!service){alert("Please fill Name, Phone, Region, Service");return;}
  let priceMatch = service.match(/GHC\s*(\d+)/i);
  let basePrice = priceMatch? parseInt(priceMatch[1]) : 500;
  let discount = (refCode!== 'Direct' && refCode!== '')? 5 : 0;
  let finalPaid = Math.round(basePrice * (1 - discount/100));
  let bookingData = {id:'C233'+Date.now(),name,phone,region,service,careType,refCode,notes,basePrice,discount,finalPaid,r:Math.round(finalPaid*0.03),staff:Math.round(finalPaid*0.05),data:Math.round(finalPaid*0.02),profit:Math.round(finalPaid*0.1),paid:false,date:new Date().toLocaleString()};
  let all = JSON.parse(localStorage.getItem('care233_bookings') || '[]');
  all.push(bookingData);
  localStorage.setItem('care233_bookings', JSON.stringify(all));
  let waMsg = "NEW BOOKING - CARE233%0AName: "+name+"%0APhone: "+phone+"%0ARegion: "+region+"%0AService: "+service+"%0AType: "+careType+"%0ADiscount: "+discount+"% ("+refCode+")%0ARef Earns (3%): GHC "+bookingData.r+"%0AEst: GHC "+finalPaid+"%0ANotes: "+notes+"%0AID: "+bookingData.id;
  window.open("https://wa.me/233544121814?text="+waMsg, "_blank");
  alert("✅ Thanks "+name+"! "+(discount? discount+"% discount applied. ":"")+"We will call "+phone+" in 30 mins.");
  document.getElementById('clientName').value="";document.getElementById('clientPhone').value="";document.getElementById('refCode').value="";document.getElementById('notes').value="";document.getElementById('refMsg').innerHTML="";document.getElementById('refCode').disabled=false;
}
</script>
</body>
</html>
