<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WEB CARE HEALTH</title><script src="https://js.paystack.co/v1/inline.js"></script><style>*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#020617;color:#fff;padding:10px}.hdr{background:linear-gradient(135deg,#0f766e,#06b6d4);padding:18px;border-radius:14px;text-align:center}.card{background:#1e293b;padding:12px;border-radius:12px;margin-top:10px;border:1px solid #334155}.tab{display:flex;gap:6px;margin-top:10px}.tab button{flex:1;padding:10px;border-radius:8px;border:0;font-weight:800}.on{background:#14b8a6;color:#fff}.off{background:#334155;color:#aaa}.pay{background:#0f766e;color:#fff;width:100%;padding:11px;border:0;border-radius:10px;font-weight:800;margin-top:7px}.loc{background:#3b82f6;color:#fff;padding:10px;border:0;border-radius:8px}.nav{background:#3b82f6;color:#fff;display:block;text-align:center;padding:9px;border-radius:9px;text-decoration:none;font-weight:800;margin-top:6px}.profile{background:#0f172a;border:2px solid #14b8a6;padding:12px;border-radius:12px;margin-top:8px}.avatar{width:70px;height:70px;border-radius:50%;background:#14b8a6;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:#fff}.badge{background:#22c55e;color:#fff;padding:2px 8px;border-radius:20px;font-size:10px}.stars{color:#fbbf24}input,select,textarea{width:100%;padding:10px;margin-top:6px;border:1px solid #475569;border-radius:8px;background:#0f172a;color:#fff}.fee{font-size:12px;background:#0f172a;padding:7px;border-radius:6px;margin-top:5px;color:#94a3b8}#chatBox{height:180px;overflow-y:auto;background:#020617;padding:8px;border-radius:8px;margin-top:6px;border:1px solid #334155}</style></head><body>
<div class="hdr"><h1>WEB CARE HEALTH</h1><p>Verified Workers + Doctor Counseling</p></div>
<div class="tab"><button id="t1" class="on" onclick="showTab(1)">🏠 Home Care</button><button id="t2" class="off" onclick="showTab(2)">👨‍⚕️ Doctors</button></div>

<div id="tab1">
<div id="list"></div>

<div class="card"><h3>👤 Client: Choose & View Profile</h3><select id="wSelect" onchange="viewProfile()"></select>
<div id="profileView"></div>
<div style="display:flex;gap:6px;margin-top:6px"><input id="cLocation" placeholder="Your Location" style="flex:1"><button class="loc" onclick="getLoc('c')">📍 GPS</button></div>
<input id="days" type="number" placeholder="Days"><input id="rate" type="number" placeholder="Rate"><input id="cEmail" placeholder="Email"><input id="cPhone" placeholder="Phone 233..."><div id="calc" class="fee">Select worker to see profile</div><button class="pay" onclick="payNow()">Pay & Share Location</button><p id="msg"></p></div>

<div class="card"><h3>👩‍⚕️ Worker Registration (Add Profile)</h3><input id="rName" placeholder="Full Name"><select id="rRole"><option value="">Role</option><option>Nurse</option><option>Caregiver</option><option>Midwife</option><option>Doctor</option></select><div style="display:flex;gap:6px"><input id="rLocation" placeholder="Base Location" style="flex:1"><button class="loc" onclick="getLoc('w')">📍 GPS</button></div><input id="rPhone" placeholder="WhatsApp 233..."><input id="rExp" type="number" placeholder="Years Experience e.g 5"><input id="rLang" placeholder="Languages e.g English, Twi, Ga"><textarea id="rBio" placeholder="About you - e.g I am a licensed nurse with 5 years in home care..."></textarea><input id="rRate" type="number" placeholder="Rate per day"><button class="pay" onclick="reg()">Register + Create Profile</button><p id="rMsg"></p></div>
<div class="card"><h3>📋 Bookings</h3><div id="bookings"></div></div>
</div>

<div id="tab2" style="display:none">
<div id="docList"></div>
<div class="card"><h3>👨‍⚕️ Doctor Registration</h3><input id="dName" placeholder="Dr. Name"><select id="dSpec"><option>General Doctor</option><option>Pediatrician</option><option>Gynecologist</option><option>Dermatologist</option><option>Psychologist</option></select><input id="dPhone" placeholder="WhatsApp 233..."><input id="dRate" type="number" placeholder="Counseling Rate 30"><select id="dAvail"><option value="online">🟢 Available Now</option><option value="offline">🔴 Busy</option></select><button class="pay" style="background:#8b5cf6" onclick="regDoc()">Register Doctor</button><p id="dMsg"></p></div>
<div class="card"><h3>💬 Quick Counseling</h3><select id="cDocSelect"></select><div id="chatBox">Select doctor...</div><textarea id="chatInput" placeholder="Describe symptoms..."></textarea><button class="pay" style="background:#8b5cf6" onclick="sendChat()">💬 Send</button><button class="pay" style="background:#22c55e" onclick="payConsult()">💳 Pay & Call Doctor</button></div>
</div>

<script>
const PK="pk_live_baf2c021aeb947445f9d53ed0ee3fd3e47acaf18";
let workers=JSON.parse(localStorage.getItem('webcare_w')||'[]'); if(!workers.length)workers=[{name:"Grace Mensah",role:"Nurse",location:"East Legon - GPS: 5.63, -0.16",phone:"233244123456",rate:150,exp:5,lang:"English, Twi",bio:"Licensed nurse with 5 years experience in home care, wound care and elderly support. Verified by Ghana Health Service.",lat:5.635,lng:-0.16,rating:4.8}];
let doctors=JSON.parse(localStorage.getItem('webcare_d')||'[]'); if(!doctors.length)doctors=[{name:"Dr. Kwame Osei",spec:"General Doctor",phone:"233244654321",rate:30,status:"online"}];
let bookings=JSON.parse(localStorage.getItem('webcare_b')||'[]'); let chats=JSON.parse(localStorage.getItem('webcare_chat')||'[]'); let consults=JSON.parse(localStorage.getItem('webcare_c')||'[]');
let wLat,wLng,cLat,cLng;
function showTab(n){document.getElementById('tab1').style.display=n==1?'block':'none';document.getElementById('tab2').style.display=n==2?'block':'none';document.getElementById('t1').className=n==1?'on':'off';document.getElementById('t2').className=n==2?'on':'off';}
function getLoc(t){navigator.geolocation.getCurrentPosition(p=>{if(t=='c'){cLat=p.coords.latitude;cLng=p.coords.longitude;document.getElementById('cLocation').value=`GPS: ${cLat.toFixed(5)}, ${cLng.toFixed(5)}`;}else{wLat=p.coords.latitude;wLng=p.coords.longitude;document.getElementById('rLocation').value=`GPS: ${wLat.toFixed(5)}, ${wLng.toFixed(5)}`;}});}
function save(){localStorage.setItem('webcare_w',JSON.stringify(workers));localStorage.setItem('webcare_d',JSON.stringify(doctors));localStorage.setItem('webcare_b',JSON.stringify(bookings));localStorage.setItem('webcare_chat',JSON.stringify(chats));localStorage.setItem('webcare_c',JSON.stringify(consults));}
function render(){let h="",o="<option value=''>Choose worker to view profile</option>";workers.forEach((w,i)=>{h+=`<div class="card" onclick="document.getElementById('wSelect').value=${i};viewProfile()" style="cursor:pointer"><b>${w.name}</b> - ${w.role} <span class="badge">✓ Verified</span><br><span class="stars">★★★★★</span> ${w.rating||4.8} • ${w.exp||3}yrs exp<br><small>📍 ${w.location}</small></div>`;o+=`<option value="${i}">${w.name} - ${w.role}</option>`;});document.getElementById('list').innerHTML=h;document.getElementById('wSelect').innerHTML=o;
let bh="";bookings.slice().reverse().forEach(b=>{let dir=b.cLat?`https://www.google.com/maps/dir/?api=1&destination=${b.cLat},${b.cLng}`:`https://www.google.com/maps/search/${encodeURIComponent(b.clientLoc)}`;bh+=`<div class="fee" style="color:#fff;padding:8px;margin-top:5px"><b>${b.workerName}</b> → ${b.clientLoc}<br><a class="nav" target="_blank" href="${dir}">🗺️ NAVIGATE</a></div>`;});document.getElementById('bookings').innerHTML=bh||"No bookings";
let dh="",do2="<option value=''>Choose Doctor</option>";doctors.forEach((d,i)=>{let st=d.status=='online'?'<span style="color:#22c55e">● Online Now</span>':'<span style="color:#64748b">● Offline</span>';dh+=`<div class="card" style="border-left:4px solid #8b5cf6"><b>${d.name}</b> - ${d.spec}<br>${st} - GHS ${d.rate}<br><a class="nav" style="background:#8b5cf6" href="https://wa.me/${d.phone}" target="_blank">💬 Chat / Call</a></div>`;do2+=`<option value="${i}">${d.name} - ${d.spec}</option>`;});document.getElementById('docList').innerHTML=dh;document.getElementById('cDocSelect').innerHTML=do2;
}
function viewProfile(){let idx=document.getElementById('wSelect').value;if(idx==="")return;let w=workers[idx];document.getElementById('rate').value=w.rate;wLat=w.lat;wLng=w.lng;calc();
let html=`<div class="profile"><div style="display:flex;gap:12px"><div class="avatar">${w.name.charAt(0)}</div><div><b style="font-size:16px">${w.name}</b> <span class="badge">✓ Verified</span><br>${w.role} • ${w.exp||3} years exp<br><span class="stars">★★★★★</span> ${w.rating||4.8} (24 reviews)<br><small style="color:#94a3b8">📍 ${w.location}</small></div></div><div style="margin-top:8px"><b>About:</b><br><small style="color:#cbd5e1">${w.bio||'Experienced healthcare professional dedicated to quality home care.'}</small><br><div style="margin-top:6px"><b>Languages:</b> ${w.lang||'English, Twi'}<br><b>Phone:</b> ${w.phone}<br><b>Rate:</b> GHS ${w.rate}/day<br><b>Status:</b> 🟢 Available & GPS Verified</div><a class="nav" href="https://wa.me/${w.phone}?text=Hi%20${encodeURIComponent(w.name)}%20I%20saw%20your%20profile%20on%20WEB%20CARE" target="_blank">💬 Chat with ${w.name.split(' ')[0]} before booking</a></div></div>`;document.getElementById('profileView').innerHTML=html;}
function calc(){let r=parseInt(document.getElementById('rate').value)||0,d=parseInt(document.getElementById('days').value)||0;if(!r||!d)return null;let tot=d*r;document.getElementById('calc').innerHTML=`Total GHS ${tot} - for ${workers[document.getElementById('wSelect').value]?.name||'worker'}`;return{tot};}
document.getElementById('days').addEventListener('input',calc);
function reg(){let n=document.getElementById('rName').value,role=document.getElementById('rRole').value,loc=document.getElementById('rLocation').value,ph=document.getElementById('rPhone').value,rt=parseInt(document.getElementById('rRate').value),exp=document.getElementById('rExp').value,lang=document.getElementById('rLang').value,bio=document.getElementById('rBio').value;if(!n||!role||!ph||!rt)return alert("Fill all");workers.push({name:n,role:role,location:loc,phone:ph,rate:rt,exp:exp,lang:lang,bio:bio,lat:wLat,lng:wLng,rating:4.8});save();render();document.getElementById('rMsg').innerText="✅ Profile Created!";}
function regDoc(){let n=document.getElementById('dName').value,s=document.getElementById('dSpec').value,p=document.getElementById('dPhone').value,r=parseInt(document.getElementById('dRate').value),st=document.getElementById('dAvail').value;if(!n||!s||!p||!r)return;doctors.push({name:n,spec:s,phone:p,rate:r,status:st});save();render();}
function payNow(){let d=calc(),cLoc=document.getElementById('cLocation').value,cPhone=document.getElementById('cPhone').value,idx=document.getElementById('wSelect').value;if(!d||!cLoc||!cPhone||idx==="")return alert("Select worker & fill");let w=workers[idx];let h=PaystackPop.setup({key:PK,email:document.getElementById('cEmail').value||"c@test.com",amount:d.tot*100,currency:"GHS",ref:"WEBCARE_"+Date.now(),callback:function(res){bookings.push({workerName:w.name,clientLoc:cLoc,clientPhone:cPhone,cLat:cLat,cLng:cLng});save();render();document.getElementById('msg').innerText="✅ Paid! "+res.reference;},onClose:function(){}});h.openIframe();}
function sendChat(){let t=document.getElementById('chatInput').value;if(!t)return;chats.push({who:"You",text:t});save();let html="";chats.slice(-20).forEach(m=>{html+=`<div><b>${m.who}:</b> ${m.text}</div>`;});document.getElementById('chatBox').innerHTML=html;document.getElementById('chatInput').value="";}
function payConsult(){let di=document.getElementById('cDocSelect').value;if(di==="")return alert("Choose doctor");let doc=doctors[di];let h=PaystackPop.setup({key:PK,email:"c@test.com",amount:doc.rate*100,currency:"GHS",ref:"CONSULT_"+Date.now(),callback:function(res){consults.push({doc:doc.name});save();window.open(`https://wa.me/${doc.phone}?text=Paid%20${res.reference}%20for%20consult`,"_blank");},onClose:function(){}});h.openIframe();}
render();
</script></body></html>
