<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner - Create Job</title><style>body{font-family:sans-serif;background:#f5f5f5;padding:15px}.card{background:#fff;padding:20px;border-radius:15px;max-width:500px;margin:auto}input,select,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}button{width:100%;padding:14px;background:#065f46;color:#facc15;border:none;border-radius:8px;font-weight:bold;font-size:16px;margin-top:10px}</style></head><body><div class="card"><h2>CARE233 - Create Job</h2><input id="client" placeholder="Client Name" value="Mrs Addo"><input id="location" placeholder="Location e.g East Legon"><select id="service"><option>Elderly Care</option><option>Nanny</option><option>House Help</option><option>Hospital Sitting</option></select><input id="date" type="date"><input id="time" placeholder="Time e.g 8am-6pm" value="8am-6pm"><input id="pay" type="number" placeholder="Pay 200"><input id="transport" type="number" placeholder="Transport 30"><textarea id="notes" placeholder="Notes"></textarea><input id="offered" placeholder="Nurse numbers comma separated" value="0544121814"><button onclick="createJob()">🚀 Create & Offer</button><p id="msg"></p></div><h3>Recent Jobs (web-care-618e8)</h3><div id="jobs"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";import{getFirestore,collection,addDoc,serverTimestamp,onSnapshot,query,orderBy}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);
window.createJob=async()=>{
const c=document.getElementById('client').value.trim(),l=document.getElementById('location').value.trim(),s=document.getElementById('service').value,d=document.getElementById('date').value,t=document.getElementById('time').value.trim(),p=document.getElementById('pay').value,tr=document.getElementById('transport').value||0,n=document.getElementById('notes').value||"",of=document.getElementById('offered').value.trim();
if(!c||!l||!d||!t||!p||!of){alert("Fill Client, Location, Date, Time, Pay, Nurses");return;}
document.getElementById('msg').innerText="Creating...";
try{await addDoc(collection(db,"jobs"),{clientName:c,location:l,service:s,date:d,time:t,pay:Number(p),transport:Number(tr),notes:n,offeredTo:of.split(',').map(x=>x.trim()),status:"offered",createdAt:serverTimestamp()});document.getElementById('msg').innerText="✅ Created!";}catch(e){document.getElementById('msg').innerText=e.message;}};
document.getElementById('date').valueAsDate=new Date();
onSnapshot(query(collection(db,"jobs"),orderBy("createdAt","desc")),snap=>{let h="";snap.forEach(doc=>{let j=doc.data();h+=`<div style="background:#fff;padding:10px;margin:6px 0;border-radius:8px"><b>${j.clientName}</b> - ${j.location} - ${j.status} - ${j.offeredTo} ${j.acceptedBy?'<br>Accepted by:'+j.acceptedBy:''}</div>`});document.getElementById('jobs').innerHTML=h;});
</script></body></html>
