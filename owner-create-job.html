<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>CARE233 Owner</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>body{font-family:sans-serif;background:#f5f5f5;padding:15px}.card{background:white;padding:20px;border-radius:15px;max-width:500px;margin:auto}input,select,textarea{width:95%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}button{background:#0A4D2E;color:#FFD700;padding:15px;border:none;border-radius:10px;width:100%;font-weight:bold;font-size:16px}.job{background:#fff;margin:10px 0;padding:15px;border-radius:10px;border-left:5px solid #FFD700}</style>
</head><body><h2 style="text-align:center;color:#0A4D2E">CARE233 Owner Panel</h2>
<div class="card"><h3>Create Job Offer</h3>
<input id="clientName" placeholder="Client Name"><input id="location" placeholder="Location e.g. East Legon"><select id="serviceType"><option>Elderly Care</option><option>Baby & Mother Care</option><option>Post-Surgery Care</option><option>Chronic Illness Care</option><option>Injection/General Nursing</option></select>
<input id="date" type="date"><input id="time" type="text" placeholder="Time e.g. 8am-6pm"><input id="pay" type="number" placeholder="Pay GHC"><input id="transport" type="number" placeholder="Transport GHC">
<textarea id="clientNote" placeholder="Note for nurse"></textarea>
<textarea id="offeredTo" placeholder="Nurses numbers comma separated e.g. 0544121814, 024XXXXXXX"></textarea>
<button onclick="createJob()">🚀 Create & Offer to Nurses</button><p id="msg"></p></div>
<h3>Recent Jobs</h3><div id="jobsList"></div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",
  authDomain: "web-care-618e8.firebaseapp.com",
  projectId: "web-care-618e8",
  storageBucket: "web-care-618e8.firebasestorage.app",
  messagingSenderId: "1062578660694",
  appId: "1:1062578660694:web:f94dfe12c929df05bce2f7"
};
firebase.initializeApp(firebaseConfig); const db=firebase.firestore();
function createJob(){
 let data={clientName:clientName.value, location:location.value, serviceType:serviceType.value, date:date.value, time:time.value, pay:parseInt(pay.value)||0, transport:parseInt(transport.value)||20, clientNote:clientNote.value, offeredTo: offeredTo.value.split(',').map(s=>s.trim()).filter(s=>s), status:'pending', createdAt: firebase.firestore.FieldValue.serverTimestamp(), rejections:[] };
 if(!data.clientName||!data.location||!data.offeredTo.length){alert('Fill all');return;}
 db.collection('jobs').add(data).then(doc=>{msg.innerText='✅ Job '+doc.id.slice(0,6)+' created!';}); }
db.collection('jobs').orderBy('createdAt','desc').limit(20).onSnapshot(snap=>{let h=''; snap.forEach(d=>{let j=d.data(); h+=`<div class="job"><b>#${d.id.slice(0,6)} - ${j.serviceType} - ${j.location} - ${j.status}</b><br>Offered: ${j.offeredTo.join(', ')}<br>Accepted: ${j.acceptedByName||'-'}<br><button onclick="db.collection('jobs').doc('${d.id}').delete()" style="background:red;color:white;padding:5px 10px;margin-top:5px">Delete</button></div>`;}); jobsList.innerHTML=h; });
</script></body></html>
