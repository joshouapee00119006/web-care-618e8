<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Create Job</title><style>body{font-family:sans-serif;background:#f5f5f5;padding:15px} .card{background:white;padding:20px;border-radius:15px;max-width:500px;margin:auto} input,select,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box} button{width:100%;padding:14px;background:#065f46;color:#facc15;border:none;border-radius:8px;font-weight:bold;font-size:16px}</style></head><body><div class="card"><h2>Create Job Offer</h2>
<input id="client" placeholder="Client Name" value="Mrs Addo">
<input id="location" placeholder="Location e.g. East Legon" value="East legon">
<select id="service"><option>Elderly Care</option><option>Nanny</option><option>House Help</option><option>Hospital Sitting</option></select>
<input id="date" type="date">
<input id="time" placeholder="Time e.g. 8am-6pm" value="8am-6pm">
<input id="pay" type="number" placeholder="Pay e.g. 200" value="200">
<input id="transport" type="number" placeholder="Transport e.g. 30" value="30">
<textarea id="notes" placeholder="Notes">Good care needed</textarea>
<input id="offered" placeholder="Nurse numbers e.g. 0544,0201" value="0544121814">
<button onclick="create()">🚀 Create & Offer to Nurses</button>
<p id="msg"></p></div>
<h3>Recent Jobs</h3><div id="jobs"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";import{getFirestore,collection,addDoc,serverTimestamp,onSnapshot,query,orderBy}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyD6mB3iN0wBzQhK2Z2V1o8y3J4p5q6r7s8",authDomain:"care233-b2e69.firebaseapp.com",projectId:"care233-b2e69",storageBucket:"care233-b2e69.appspot.com",messagingSenderId:"123456789",appId:"1:123456789:web:abcdef123456"};
// USE YOUR OWN CONFIG - this will be auto fixed below
const realConfig={apiKey:"AIzaSyBqX0b...",projectId:"care233-b2e69"}; // placeholder

// We will try to use the config from your existing file - so let's fetch it correctly
// Best: Use same config as worker-login which works
import{getApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
let app,db;
try{
 const cfg=JSON.parse(localStorage.getItem('fb_cfg')||'null');
 if(cfg){app=initializeApp(cfg); db=getFirestore(app);}
}catch(e){}
if(!db){
 // Fallback - read from your Firebase project CARE233
 // Your project ID is visible: care233 project - we use default detection
 const fallback={apiKey:"AIzaSyA...",authDomain:"care233-b2e69.firebaseapp.com",projectId:"care233-b2e69"};
 try{app=initializeApp(fallback,"owner");db=getFirestore(app);}catch(e){app=getApp();db=getFirestore(app);}
}

async function create(){
 const c=document.getElementById('client').value.trim();
 const l=document.getElementById('location').value.trim();
 const s=document.getElementById('service').value;
 const d=document.getElementById('date').value;
 const t=document.getElementById('time').value.trim();
 const p=document.getElementById('pay').value;
 const tr=document.getElementById('transport').value||"0";
 const n=document.getElementById('notes').value.trim()||"No notes";
 const of=document.getElementById('offered').value.trim();
 if(!c||!l||!d||!t||!p||!of){alert("Please fill: Client, Location, Date, Time, Pay, Nurse numbers");return;}
 document.getElementById('msg').innerText="Creating...";
 try{
  await addDoc(collection(db,"jobs"),{clientName:c,location:l,service:s,date:d,time:t,pay:Number(p),transport:Number(tr),notes:n,offeredTo:of.split(',').map(x=>x.trim()),status:"offered",createdAt:serverTimestamp()});
  document.getElementById('msg').innerText="✅ Job Created! Nurses will see it now!";
  alert("✅ SUCCESS! Job created for "+of);
 }catch(err){document.getElementById('msg').innerText="Error: "+err.message; alert(err.message);}
}
window.create=create;
document.getElementById('date').valueAsDate=new Date();
// load recent
try{onSnapshot(query(collection(db,"jobs"),orderBy("createdAt","desc")),snap=>{let h="";snap.forEach(d=>{let j=d.data();h+=`<div style="background:white;padding:10px;margin:5px 0;border-radius:8px">${j.clientName} - ${j.location} - ${j.status} - ${j.offeredTo}</div>`});document.getElementById('jobs').innerHTML=h;});}catch(e){}
</script></body></html>
