<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nurses Group - Worker App</title>
<style>
body{background:#0a2e1f;color:white;font-family:Arial;padding:12px;margin:0}
.card{background:#111;padding:22px;border-radius:20px;max-width:450px;margin:auto}
h2{color:#ffcc00;text-align:center;margin:0 0 5px}
.sub{text-align:center;color:#8fbc8f;font-size:13px;margin-bottom:15px}
.tabs{display:flex;gap:10px;margin-bottom:15px}
.tab{flex:1;padding:12px;border-radius:12px;border:none;font-weight:bold;cursor:pointer}
.tabActive{background:#0a4d2e;color:#ffcc00} .tabOff{background:#2a2a2a;color:white}
input,select{width:100%;padding:14px;margin:7px 0;border-radius:12px;border:2px solid #2a8a6a;background:#222;color:white;box-sizing:border-box}
.btn{width:100%;padding:15px;background:#0a4d2e;color:#ffcc00;border:none;border-radius:12px;font-weight:bold;font-size:17px;margin-top:10px}
.small{font-size:12px;color:#8fbc8f;text-align:center;margin-top:10px}
.link{color:#25D366}
.job{background:#132a20;padding:12px;border-radius:12px;margin:8px 0;border-left:4px solid #ffcc00}
.hidden{display:none}
</style>
</head>
<body>
<div class="card">
<h2>👩‍⚕️ NURSES GROUP</h2>
<p class="sub">Official Worker Platform - Ghana</p>

<div class="tabs">
<button id="tLogin" class="tab tabActive" onclick="show('login')">Login</button>
<button id="tReg" class="tab tabOff" onclick="show('reg')">Register</button>
</div>

<!-- LOGIN -->
<div id="loginBox">
<input id="lPhone" placeholder="Phone Number (0244...)">
<input id="lPass" type="password" placeholder="Password">
<button class="btn" onclick="login()">🔓 LOGIN</button>
<p id="lMsg" class="small"></p>
</div>

<!-- REGISTER -->
<div id="regBox" class="hidden">
<input id="rName" placeholder="Full Name *">
<input id="rPhone" placeholder="Phone Number * (0244...)">
<input id="rPass" type="password" placeholder="Create Password * (min 4 chars)">
<input id="rMoMo" placeholder="MoMo Number * (for payment)">
<input id="rLoc" placeholder="Your Location * (East Legon)">
<select id="rSkill">
<option>General Nurse</option>
<option>Midwife</option>
<option>Care Assistant</option>
<option>Physiotherapy</option>
</select>
<button class="btn" onclick="register()">📝 REGISTER</button>
<p id="rMsg" class="small"></p>
</div>

<!-- DASHBOARD -->
<div id="dashBox" class="hidden">
<h3 style="color:#7fdbc0">Welcome, <span id="wName"></span> 👋</h3>
<p class="small">Phone: <span id="wPhone"></span> | Status: <span id="wStatus"></span></p>
<h4>📋 Available Jobs</h4>
<div id="jobsList"></div>
<button class="btn" style="background:#2a2a2a;color:white" onclick="logout()">Logout</button>
</div>

</div>

<script>
function show(t){
 document.getElementById('loginBox').className = t==='login'?'':'hidden';
 document.getElementById('regBox').className = t==='reg'?'':'hidden';
 document.getElementById('tLogin').className = t==='login'?'tab tabActive':'tab tabOff';
 document.getElementById('tReg').className = t==='reg'?'tab tabActive':'tab tabOff';
}

function register(){
 let name=document.getElementById('rName').value.trim();
 let phone=document.getElementById('rPhone').value.trim();
 let pass=document.getElementById('rPass').value.trim();
 let momo=document.getElementById('rMoMo').value.trim();
 let loc=document.getElementById('rLoc').value.trim();
 let skill=document.getElementById('rSkill').value;
 if(!name||!phone||!pass||!momo||!loc){document.getElementById('rMsg').innerText='Fill all * fields';return}
 if(pass.length<4){document.getElementById('rMsg').innerText='Password too short';return}
 let workers=JSON.parse(localStorage.getItem('care233_workers')||'[]');
 if(workers.find(w=>w.phone===phone)){document.getElementById('rMsg').innerText='Phone already registered. Login.';return}
 workers.push({name:name, phone:phone, pass:pass, momo:momo, loc:loc, skill:skill, approved:false, date:new Date().toLocaleString()});
 localStorage.setItem('care233_workers',JSON.stringify(workers));
 document.getElementById('rMsg').innerText='✅ Registered! Wait for Admin Approval. Then Login.';
 setTimeout(()=>show('login'),1500);
}

function login(){
 let phone=document.getElementById('lPhone').value.trim();
 let pass=document.getElementById('lPass').value.trim();
 let workers=JSON.parse(localStorage.getItem('care233_workers')||'[]');
 let w=workers.find(x=>x.phone===phone && x.pass===pass);
 if(!w){document.getElementById('lMsg').innerText='❌ Wrong phone or password';return}
 if(!w.approved){document.getElementById('lMsg').innerText='⏳ Not yet approved by Admin. Call CEO.';return}
 localStorage.setItem('care233_current',JSON.stringify(w));
 openDash(w);
}

function openDash(w){
 document.getElementById('loginBox').className='hidden';
 document.getElementById('regBox').className='hidden';
 document.getElementById('dashBox').className='';
 document.getElementById('wName').innerText=w.name;
 document.getElementById('wPhone').innerText=w.phone;
 document.getElementById('wStatus').innerText=w.approved?'✅ Approved':'Pending';
 loadJobs();
}

function loadJobs(){
 let jobs=JSON.parse(localStorage.getItem('care233_jobs')||'[]');
 let html='';
 if(jobs.length===0) html='<p class="small">No jobs yet. Wait for bookings.</p>';
 jobs.reverse().forEach(j=>{
   let gpsBtn=j.gps?`<a class="link" target="_blank" href="https://www.google.com/maps?q=${j.gps}">🗺️ GPS Directions</a>`:'No GPS';
   html+=`<div class="job"><b>${j.service}</b><br>📍 ${j.location}<br>💰 ${j.price}<br>📞 ${j.phone}<br>${gpsBtn}<br><small>${j.date}</small></div>`;
 });
 document.getElementById('jobsList').innerHTML=html;
}

function logout(){
 localStorage.removeItem('care233_current');
 location.reload();
}

// Auto login if already
let cur=JSON.parse(localStorage.getItem('care233_current')||'null');
if(cur && cur.approved) openDash(cur);
</script>
</body>
</html>
