<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CARE233 Worker</title>
<style>
body{background:#e8f5e9;font-family:Arial;padding:15px;margin:0}
.card{max-width:480px;margin:auto;background:white;padding:25px;border-radius:18px;box-shadow:0 4px 15px rgba(0,0,0,0.1)}
h1{color:#0a4d2e;text-align:center;font-size:22px}
.tabs{display:flex;gap:10px;margin:20px 0}
.tab{flex:1;padding:12px;border-radius:10px;border:2px solid #0a4d2e;background:white;color:#0a4d2e;font-weight:bold;cursor:pointer}
.tab.active{background:#0a4d2e;color:white}
input,select,textarea{width:100%;padding:13px;margin:8px 0;border:2px solid #ddd;border-radius:10px;box-sizing:border-box;font-size:15px}
.btn{width:100%;padding:15px;background:#0a4d2e;color:white;border:none;border-radius:10px;font-weight:bold;font-size:16px;margin-top:10px;cursor:pointer}
.msg{padding:12px;border-radius:8px;margin:10px 0;text-align:center;display:none}
.msg.ok{background:#d4edda;color:#155724;display:block}
.msg.bad{background:#f8d7da;color:#721c24;display:block}
.msg.wait{background:#fff3cd;color:#856404;display:block}
.hidden{display:none}
.job{border:1px solid #ddd;padding:12px;border-radius:10px;margin:10px 0}
</style>
</head>
<body>
<div class="card" id="authCard">
<h1>👷 CARE233 WORKER</h1>
<div class="tabs">
<button class="tab active" id="tabLogin" onclick="showTab('login')">Login</button>
<button class="tab" id="tabReg" onclick="showTab('reg')">Register</button>
</div>

<div id="loginBox">
<input id="loginPhone" placeholder="Phone Number *">
<input id="loginPass" type="password" placeholder="Password *">
<button class="btn" onclick="doLogin()">LOGIN</button>
<div id="loginMsg" class="msg"></div>
<p style="font-size:12px;text-align:center;color:gray">Only admin-approved workers can login</p>
</div>

<div id="regBox" class="hidden">
<input id="rName" placeholder="Full Name *">
<input id="rPhone" placeholder="Phone Number *">
<input id="rPass" type="password" placeholder="Create Password * (min 4)">
<input id="rPass2" type="password" placeholder="Confirm Password *">
<input id="rMomo" placeholder="MoMo Number for Payment *">
<select id="rService">
<option value="">Select Your Service *</option>
<option>House Cleaning</option><option>Cooking / Chef</option>
<option>Laundry</option><option>Plumbing</option>
<option>Electrical</option><option>Carpentry</option>
<option>Painting</option><option>Babysitting / Nanny</option>
<option>Elderly Care</option><option>Security Guard</option>
<option>Driver</option><option>Gardening</option><option>Other Artisan</option>
</select>
<input id="rLocation" placeholder="Location (eg Accra, East Legon) *">
<input id="rExp" placeholder="Years Experience">
<textarea id="rBio" placeholder="Short bio..."></textarea>
<button class="btn" onclick="doRegister()">SUBMIT FOR APPROVAL</button>
<div id="regMsg" class="msg"></div>
</div>
</div>

<div class="card hidden" id="dash">
<h1>Welcome <span id="wName"></span> ✅</h1>
<p style="text-align:center"><span id="wService"></span> | Approved</p>
<button class="btn" style="background:#6c757d" onclick="logout()">Logout</button>
<h3>Available Jobs</h3>
<div id="jobsList"></div>
</div>

<script>
function showTab(t){
 document.getElementById('loginBox').classList.toggle('hidden', t!=='login');
 document.getElementById('regBox').classList.toggle('hidden', t!=='reg');
 document.getElementById('tabLogin').classList.toggle('active', t==='login');
 document.getElementById('tabReg').classList.toggle('active', t==='reg');
}
function getPending(){return JSON.parse(localStorage.getItem('care233_pending')||'[]')}
function getApproved(){return JSON.parse(localStorage.getItem('care233_workers')||'[]')}
function savePending(a){localStorage.setItem('care233_pending',JSON.stringify(a))}
function saveApproved(a){localStorage.setItem('care233_workers',JSON.stringify(a))}

function doRegister(){
 let name=document.getElementById('rName').value.trim();
 let phone=document.getElementById('rPhone').value.trim();
 let pass=document.getElementById('rPass').value.trim();
 let pass2=document.getElementById('rPass2').value.trim();
 let momo=document.getElementById('rMomo').value.trim();
 let service=document.getElementById('rService').value;
 let loc=document.getElementById('rLocation').value.trim();
 let exp=document.getElementById('rExp').value.trim();
 let bio=document.getElementById('rBio').value.trim();
 let msg=document.getElementById('regMsg');
 if(!name||!phone||!pass||!momo||!service||!loc){msg.className='msg bad';msg.innerText='Fill all * fields';return}
 if(pass.length<4){msg.className='msg bad';msg.innerText='Password min 4 characters';return}
 if(pass!==pass2){msg.className='msg bad';msg.innerText='Passwords do not match';return}
 let pending=getPending(); let approved=getApproved();
 if(pending.find(w=>w.phone===phone)||approved.find(w=>w.phone===phone)){msg.className='msg bad';msg.innerText='Phone already registered';return}
 pending.push({name,phone,password:pass,momo,service,location:loc,exp,bio,date:new Date().toLocaleString(),status:'pending'});
 savePending(pending);
 msg.className='msg wait';msg.innerText='✅ Submitted! Wait for admin approval, then login with your password.';
}

function doLogin(){
 let phone=document.getElementById('loginPhone').value.trim();
 let pass=document.getElementById('loginPass').value.trim();
 let msg=document.getElementById('loginMsg');
 if(!phone||!pass){msg.className='msg bad';msg.innerText='Enter phone & password';return}
 let approved=getApproved();
 let worker=approved.find(w=>w.phone===phone && w.password===pass);
 if(!worker){
   let pending=getPending();
   if(pending.find(w=>w.phone===phone && w.password===pass)){msg.className='msg wait';msg.innerText='⏳ Still pending approval. Contact Admin.';}
   else if(pending.find(w=>w.phone===phone)||approved.find(w=>w.phone===phone)){msg.className='msg bad';msg.innerText='❌ Wrong password!';}
   else{msg.className='msg bad';msg.innerText='❌ Not found. Please Register.'; showTab('reg');}
   return;
 }
 localStorage.setItem('care233_currentWorker',JSON.stringify(worker));
 openDash(worker);
}
function openDash(worker){
 document.getElementById('authCard').classList.add('hidden');
 document.getElementById('dash').classList.remove('hidden');
 document.getElementById('wName').innerText=worker.name;
 document.getElementById('wService').innerText=worker.service;
 let jobs=JSON.parse(localStorage.getItem('care233_jobs')||'[]');
 let list=document.getElementById('jobsList');
 if(jobs.length===0){list.innerHTML='<p>No jobs yet</p>';return;}
 list.innerHTML=jobs.map((j,i)=>`<div class="job"><b>${j.service}</b> - ${j.location}<br>${j.desc||''}<br><small>${j.date||''}</small><br><button class="btn" onclick="alert('Accepted Job #${i}')">Accept</button></div>`).join('');
}
function logout(){localStorage.removeItem('care233_currentWorker');location.reload();}
let cur=localStorage.getItem('care233_currentWorker');
if(cur){try{openDash(JSON.parse(cur));}catch(e){}}
</script>
</body>
</html>
