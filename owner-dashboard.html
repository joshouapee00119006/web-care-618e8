<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>CARE233 - Owner Dashboard</title><style>body{margin:0;font-family:sans-serif;background:#f5f5f5} .top{background:#065f46;color:#fff;padding:15px;text-align:center} .stats{display:flex;gap:8px;padding:10px} .stat{flex:1;background:#fff;padding:12px;border-radius:12px;text-align:center;font-weight:bold} .filter{padding:10px;display:flex;gap:6px} .filter button{flex:1;padding:10px;border:none;border-radius:8px;font-weight:bold} .job{background:#fff;margin:8px;padding:12px;border-radius:12px;border-left:6px solid orange} .job.accepted{border-left-color:green} .job.rejected{border-left-color:red} .call{background:#16a34a;color:#fff;padding:10px 15px;border:none;border-radius:8px;font-weight:bold;display:inline-block;margin-top:8px;text-decoration:none}</style></head><body>
<div class="top"><h1 style="color:#facc15;margin:0">CARE233</h1><p>Owner Dashboard - LIVE</p><a href="owner-create-job.html" style="color:#facc15">+ Create New Job</a></div>
<div class="stats"><div class="stat" id="total">0 Total</div><div class="stat" id="offered" style="color:orange">0 Offered</div><div class="stat" id="accepted" style="color:green">0 Accepted</div><div class="stat" id="rejected" style="color:red">0 Rejected</div></div>
<div class="filter"><button onclick="setFilter('all')" style="background:#065f46;color:#fff">All</button><button onclick="setFilter('offered')" style="background:orange;color:#fff">Offered</button><button onclick="setFilter('accepted')" style="background:green;color:#fff">Accepted</button><button onclick="setFilter('rejected')" style="background:red;color:#fff">Rejected</button></div>
<div id="jobs"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";import{getFirestore,collection,query,orderBy,onSnapshot}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyB52-X1D8Cg-wUDWPds_tR7X3cF82dMdRg",authDomain:"web-care-618e8.firebaseapp.com",projectId:"web-care-618e8",storageBucket:"web-care-618e8.firebasestorage.app",messagingSenderId:"1062578660694",appId:"1:1062578660694:web:f94dfe12c929df05bce2f7"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);
let allJobs=[],filter='all';
function setFilter(f){filter=f;render();}
window.setFilter=setFilter;
onSnapshot(query(collection(db,"jobs"),orderBy("createdAt","desc")),snap=>{
allJobs=[];snap.forEach(d=>allJobs.push({id:d.id,...d.data()}));
document.getElementById('total').innerText=allJobs.length+" Total";
document.getElementById('offered').innerText=allJobs.filter(j=>j.status==='offered').length+" Offered";
document.getElementById('accepted').innerText=allJobs.filter(j=>j.status==='accepted').length+" Accepted";
document.getElementById('rejected').innerText=allJobs.filter(j=>j.status==='rejected').length+" Rejected";
render();
});
function render(){
let h="";let list=filter==='all'?allJobs:allJobs.filter(j=>j.status===filter);
if(list.length===0)h="<div style='padding:20px;text-align:center'>No "+filter+" jobs</div>";
list.forEach(j=>{
h+=`<div class="job ${j.status}"><b>${j.clientName}</b> - ${j.location}<br>${j.service} | ${j.date} ${j.time}<br>Pay: GHS ${j.pay} + ${j.transport} | Offered to: ${j.offeredTo}<br>Status: <b>${j.status.toUpperCase()}</b>`;
if(j.status==='accepted')h+=`<br>✅ <b>ACCEPTED BY: ${j.acceptedByName||''} - ${j.acceptedBy}</b><br><a class="call" href="tel:${j.acceptedBy}">📞 Call Nurse ${j.acceptedBy}</a> <a class="call" style="background:#065f46" href="https://wa.me/233${j.acceptedBy.slice(-9)}">💬 WhatsApp</a>`;
if(j.status==='rejected')h+=`<br>❌ Rejected by ${j.rejectedBy} Reason: ${j.rejectedReason||''}`;
h+=`</div>`;
});
document.getElementById('jobs').innerHTML=h;
}
</script></body></html>
